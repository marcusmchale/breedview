# The datasets of an analysis for its summary download: each one's study and the study's licence, by name, and whom to
# credit for each, its controlling teams' attributions
query AnalysisSummaryDatasets($datasetIds: [ID!]!) {
  datasets(ids: $datasetIds) {
    status
    result {
      id
      studyId
      licence {
        id
        description
      }
    }
    errors {
      message
    }
  }
  controlsAttributions(entityLabel: DATASET, entityIds: $datasetIds) {
    status
    result {
      entityId
      attributions
    }
    errors {
      message
    }
  }
}
