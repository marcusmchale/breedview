query AnalysisDatasets($datasetIds: [ID!]) {
  datasets(ids: $datasetIds) {
    status
    result {
      id
      studyId
      concept {
        id versionId view
        name
        ... on Variable {
          scale { id versionId view name scaleType categories { id name } }
        }
        ... on Factor {
          scale { id versionId view name scaleType categories { id name } }
        }
      }
    }
    errors {
      name
      message
    }
  }
}
