query referencesFileDownloadState($fileId: ID!) {
  referencesFileDownloadState(fileId: $fileId) {
    status
    result {
      status
      progress {
        startedAt
        progress
      }
      # the study licences to accept before the download: those of the datasets citing the file, seen or not
      licences {
        id
        description
        text
        textFormat
        contentHash
        filename
        contentType
        fileId
        accepted
      }
    }
    errors {
      message
    }
  }
}
