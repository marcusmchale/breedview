mutation referencesCreateExternalData(
  $reference: ExternalDataReferenceInput!
  $controlTeamId: ID!
  $release: ReadRelease
) {
  referencesCreateExternalData(
    reference: $reference
    controlTeamId: $controlTeamId
    release: $release
  ) {
    status
    result
    errors {
      message
    }
  }
}
