#import "../people/personFragment.graphql"
fragment ReferenceFields on ReferenceInterface {
    id
    description
    ... on LegalReference { text textFormat contentHash filename contentType fileId }
    ... on ExternalReference { url externalId }
    ... on FileReference { filename fileId contentType contributions { person { ...PersonFields } roles { id versionId view name phase } } }
    ... on DataFileReference { filename fileId contentType schema format contributions { person { ...PersonFields } roles { id versionId view name phase } } }
    ... on ExternalDataReference { url externalId schema format contributions { person { ...PersonFields } roles { id versionId view name phase } } }
}