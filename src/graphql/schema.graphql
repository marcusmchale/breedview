input TeamInvitationInput {
  teamId: ID!
  access: Access!
}

"""
Defines how values are divided into bins.

The same binning configuration can be applied to supported numeric,
temporal, and duration values.
"""
input BinningInput {
  """
  Boundary values separating the bins.
  
  With N boundaries, N + 1 bins are created.
  
  Boundary values are interpreted according to the type of the
  value being binned.
  """
  boundaries: [String!]!

  """
  Labels assigned to the resulting bins.
  
  There must be exactly one more label than there are boundaries.
  """
  labels: [String!]!

  """Determines which bin receives a value exactly equal to a boundary."""
  boundary: BinningBoundary!
}

"""
Defines how record start/end time is used to construct a time
grouping dimension.

This configuration concerns the temporal metadata associated
with records. It does not describe concepts whose values happen
to represent dates, times or durations.
"""
input TimeSpecificationInput {
  """
  Determines how records are assigned to time bins.
  
  If time assignment is provided and a record has no applicable
  time information, the record is excluded from the analysis.
  """
  assignment: TimeAssignment!

  """Defines the time bins used to construct the grouping dimension."""
  binning: BinningInput!
}

"""
Defines how germplasm is resolved into analytical groups.

The server navigates the germplasm hierarchy from the germplasm
assigned to each unit to find the applicable selected ancestor,
or with none selected, takes each unit's germplasm as a group.
A unit's germplasm is its own, or else the one it inherits from
the units above it (Unit.inheritedGermplasm).
"""
input GermplasmGroupingInput {
  """
  Germplasm IDs defining the grouping levels.
  
  Descendant germplasm is assigned to the corresponding selected
  ancestor while preserving the hierarchy of the grouping. Empty:
  each unit's own germplasm is a level.
  """
  germplasmIds: [ID!]!
}

"""
The observation unit: each record's base unit is rolled up into its
nearest unit of one of the subjects, the unit itself or an ancestor,
e.g. trees into their plots. A base unit with none, or whose nearest
lie on separate lineages, is unassigned. Only units you can read count.
"""
input UnitGroupingInput {
  """Subject IDs whose units observations are made at, e.g. Plot."""
  subjectIds: [ID!]!
}

"""
Defines where the units of records were, as the dimensions of a
LOCATION term and a LAYOUT_AXIS term for each axis.

A position counts when its location is, or is below, a location of
one of the location types, and when axes are configured, it is in a
layout with a value on each axis. A record is
placed by the nearest unit with a position that counts: its own unit,
or else the nearest units above it, one on each lineage, which must
agree. Of a unit's positions that count, the one holding at the
record's time places it; without a time, or when none holds then,
they must agree. Records that can't be placed are excluded from the
analysis and reported in a warning.
"""
input PositionGroupingInput {
  """
  Location types from the ontology. A record's location is the
  nearest location of one of them, at or above its unit's position.
  """
  locationTypeIds: [ID!]!

  """
  Subjects whose units place the units below them, e.g. Tree, so
  that a sample analysed in a lab is placed where its tree was.
  """
  subjectIds: [ID!]

  """
  Names of layout axes, each a dimension (a LAYOUT_AXIS term). The
  value comes from the position's layout or a layout above it, and
  is nested in the layout that has the axis.
  """
  axes: [String!]

  """
  Stands in for each record's time in choosing between a unit's
  positions.
  """
  time: DateTime
}

"""A code of a record grouping."""
input RecordGroupMemberInput {
  """ID of the record grouping."""
  groupingId: ID!

  """Record group code within the grouping."""
  code: String!

  """
  A selected dataset in the scope the code belongs to.
  
  Required for dataset-scoped groupings, where equal codes in
  different scopes are distinct levels. Must not be provided for
  study-wide groupings.
  """
  datasetId: ID
}

"""
Defines a level shared by codes from one or more record groupings.

Use this when codes from different groupings or scopes represent
the same thing, e.g. a processing batch that included samples
from several studies.
"""
input RecordGroupLevelInput {
  """
  Label of the level in analysis results.
  
  Unique within the dimension. Must not contain "|".
  """
  label: String!

  """
  Codes that belong to this level. Each code may belong to only one level.
  """
  members: [RecordGroupMemberInput!]!
}

"""
Defines a record group dimension, which may span studies.

Levels are nested by default: each code is a distinct level within
its grouping and scope, so equal codes from different studies or
scopes are never pooled. Level definitions explicitly combine codes
into shared levels; codes not included in a level definition keep
their nested identity.

Each study has one source of levels. Records of a study with one of
the dimension's groupings take its codes. Records of other studies
take the nearest unit of one of the dimension's subjects, their own
unit or an ancestor, e.g. the plots of a field, as a level of its own.

Records with no code, or in a study without a grouping, no such unit
(or two on separate lineages), are excluded from the analysis and
reported in a warning.
"""
input RecordGroupDimensionInput {
  """
  Name of the dimension, unique within the analysis.
  
  Referenced by AnalysisTermReferenceInput.recordGroupDimension
  and used as the label of the dimension in results.
  """
  name: String!

  """
  Record groupings contributing to the dimension.
  
  Each grouping must belong to the study of a selected dataset.
  At most one grouping per study, and each grouping may contribute
  to only one dimension in the analysis.
  """
  groupingIds: [ID!]

  """
  Subjects whose units are levels, for studies without one of the groupings.
  
  Each subject may contribute to only one dimension in the analysis.
  A dimension needs at least one grouping or subject.
  """
  subjectIds: [ID!]

  """Optional shared levels combining codes across groupings or scopes."""
  levels: [RecordGroupLevelInput!]
}

"""
Defines the dimensions used to construct analytical observations.

The observation unit is always part of observation identity: the
base unit of each record, or its nearest unit of one of the
subjects of unit. Each configured dimension also contributes to
observation identity: germplasm gives each unit one level, while
time, record group codes and a unit's moves can split its records. Study contributes only when a STUDY term
is used.

Records that cannot be assigned to a configured dimension are
excluded from the analysis and reported in a warning.
"""
input AnalysisGroupingInput {
  """Groups records according to their record start/end time."""
  time: TimeSpecificationInput

  """Groups units according to germplasm hierarchy."""
  germplasm: GermplasmGroupingInput

  """
  The observation unit: rolls each record's base unit up into its
  nearest unit of one of the subjects. Without it, each base unit.
  """
  unit: UnitGroupingInput

  """Groups records according to geographic or layout position."""
  position: PositionGroupingInput

  """
  Groups records according to study record groupings, e.g. batch or replicate.
  """
  recordGroups: [RecordGroupDimensionInput!]
}

"""Type of analysis to perform."""
enum AnalysisType {
  """Analysis of variance using a statistical model."""
  ANOVA

  """Multidimensional scaling."""
  MDS

  """Pairwise correlation analysis."""
  CORRELATION

  """Descriptive statistics."""
  DESCRIPTIVE_STATISTICS

  """Detection of observations that may be statistical outliers."""
  OUTLIER_DETECTION
}

"""Defines how a term is represented for an analysis."""
enum TermRepresentationType {
  """Treat values as continuous numeric measurements."""
  CONTINUOUS

  """Treat values as nominal categorical values."""
  CATEGORICAL

  """Treat values as ordered categorical values."""
  ORDINAL
}

"""
Defines whether a model term is estimated as a fixed or random
effect.
"""
enum TermEffect {
  """Estimate the effect directly as a fixed effect."""
  FIXED

  """Estimate the effect as a random effect."""
  RANDOM
}

"""
Transformations that may be applied to term values before analysis.

Transformations are applied in the order in which they are provided.
"""
enum TermTransformation {
  """Centre values by subtracting their mean."""
  CENTER

  """Standardise values using their mean and standard deviation."""
  STANDARDIZE

  """Apply the natural logarithm."""
  LOG

  """Apply log(1 + x)."""
  LOG1P

  """Apply the square-root transformation."""
  SQRT

  """Apply the reciprocal transformation."""
  RECIPROCAL
}

"""
Defines how multiple records contributing to an analytical
observation are aggregated.
"""
enum TermAggregation {
  """
  Do not aggregate values.
  
  The analysis requires at most one applicable value for
  each analytical observation.
  """
  NONE

  """Arithmetic mean."""
  MEAN

  """Median."""
  MEDIAN

  """Minimum value."""
  MIN

  """Maximum value."""
  MAX

  """Sum of values."""
  SUM

  """Number of applicable values."""
  COUNT

  """Most frequently occurring value."""
  MODE
}

"""
Type of term used by an analysis.

Each domain term type corresponds to a dimension of analytical
observation identity.
"""
enum AnalysisTermType {
  """A dataset concept."""
  CONCEPT

  """The time dimension. Requires grouping.time."""
  TIME

  """The germplasm dimension. Requires grouping.germplasm."""
  GERMPLASM

  """
  The observation unit: the base unit of each record, or its
  nearest unit of a subject when grouping.unit is configured.
  """
  UNIT

  """
  Where the units were: the nearest location of one of the location
  types of grouping.position. Requires grouping.position.
  """
  LOCATION

  """
  The values on a layout axis, identified by layoutAxis, nested in
  the layout that has the axis. Requires the axis in grouping.position.axes.
  """
  LAYOUT_AXIS

  """
  A record group dimension, identified by recordGroupDimension.
  Requires a matching dimension in grouping.recordGroups.
  """
  RECORD_GROUP

  """
  The study each record belongs to.
  
  Requires no configuration. When used, study becomes part of
  observation identity, so records of a unit in different studies
  form distinct observations.
  """
  STUDY
}

"""Determines how records are assigned to time bins."""
enum TimeAssignment {
  """
  Assign a record according to the start of its period: the start of the period of its start time.
  
  If no start is found for the record, use its end time: a record ending 2021-05-03 starts that day.
  """
  START

  """
  Assign a record according to the end of its period: the last moment of the period of its end time,
  so a record ending 2021-05-03 is assigned to the end of that day.
  
  If no end is found for the record, use the end of the period of its start time.
  """
  END

  """
  Assign the observation to the bin containing the midpoint of its period, from the start of the
  period of its start time to the end of the period of its end time.
  
  A record with only one time takes the midpoint of that time's period: a record of 2021 has its
  midpoint in July.
  """
  MIDPOINT
}

"""
Determines which side of a bin boundary receives a value equal
to the boundary.
"""
enum BinningBoundary {
  """
  A value equal to the boundary is assigned to the bin on the
  lower-value side of the boundary.
  """
  LEFT

  """
  A value equal to the boundary is assigned to the bin on the
  higher-value side of the boundary.
  """
  RIGHT
}

"""Distance metric used to calculate dissimilarities for MDS."""
enum DistanceMetric {
  EUCLIDEAN
  MANHATTAN
  MINKOWSKI
}

"""Correlation method used to calculate a correlation matrix."""
enum CorrelationMethod {
  PEARSON
  SPEARMAN
  KENDALL
}

"""Method used to detect potential outliers."""
enum OutlierDetectionMethod {
  Z_SCORE
  IQR
  MAHALANOBIS
}

"""Clustering methods supported for MDS observations."""
enum ClusteringMethod {
  KMEANS
  HIERARCHICAL
}

"""Type of sums of squares used for ANOVA tables."""
enum SumOfSquaresType {
  TYPE_II

  """Uses sum-to-zero contrasts."""
  TYPE_III
}

"""Method for denominator degrees of freedom in mixed models."""
enum DdfMethod {
  SATTERTHWAITE
  KENWARD_ROGER
}

"""Contrasts between estimated marginal means."""
enum EstimatedMeansContrast {
  """All pairwise comparisons."""
  PAIRWISE

  """Comparisons of each level against a control level."""
  TRT_VS_CTRL

  """Means only."""
  NONE
}

"""Adjustment of p values for multiple comparisons."""
enum PValueAdjustment {
  TUKEY
  BONFERRONI
  HOLM
  SIDAK
  NONE
}

"""
Defines estimated marginal means (least-squares means) and their contrasts.
"""
input EstimatedMeansInput {
  """Model terms for which means are estimated."""
  terms: [AnalysisTermReferenceInput!]!

  """Model terms conditioning the estimates, for simple effects."""
  by: [AnalysisTermReferenceInput!]

  """Contrasts between the estimated means. NONE returns means only."""
  contrast: EstimatedMeansContrast = PAIRWISE

  """Level of the control, required for TRT_VS_CTRL."""
  control: String

  """Adjustment of p values for multiple comparisons."""
  adjustment: PValueAdjustment = TUKEY
}

"""
Defines an analysis to be submitted for execution.

Analysis configurations are validated by the server according
to analysisType.
"""
input AnalysisInput {
  """Type of analysis to perform."""
  analysisType: AnalysisType!

  """Optional name for the analysis."""
  name: String

  """Datasets whose records are included in the analysis."""
  datasetIds: [ID!]!

  """
  Rules for excluding records from the analysis.
  
  A record is excluded if it matches any rule.
  """
  exclusions: [AnalysisExclusionInput!]

  """ANOVA configuration."""
  anova: AnovaInput

  """MDS configuration."""
  mds: MDSInput

  """Correlation configuration."""
  correlation: CorrelationInput

  """Descriptive statistics configuration."""
  descriptiveStatistics: DescriptiveStatisticsInput

  """Outlier detection configuration."""
  outlierDetection: OutlierDetectionInput
}

"""
A rule for excluding records from an analysis.

A record matches the rule when it matches ALL provided criteria.
Within a list criterion, a record matches when ANY element matches.
At least one criterion is required.

Matching is exact: excluding a germplasm does not exclude its
descendants, and excluding a unit does not exclude its children.
"""
input AnalysisExclusionInput {
  """IDs of records to exclude."""
  recordIds: [ID!]

  """IDs of the base units of records to exclude."""
  unitIds: [ID!]

  """
  IDs of the germplasm of the base units of records to exclude: a
  unit's own germplasm, or the one it inherits (Unit.inheritedGermplasm).
  """
  germplasmIds: [ID!]

  """IDs of the studies of records to exclude."""
  studyIds: [ID!]

  """
  Positions of the base units of records to exclude.
  
  Evaluated against the unit position history only: a record matches
  when any position interval of its unit matching a criterion overlaps
  [start, end], regardless of the record time.
  """
  positions: [PositionExclusionInput!]

  """Record group codes of records to exclude."""
  recordGroups: [RecordGroupMemberInput!]

  """
  Inclusive start of the rule (ISO 8601). Null means unbounded.
  
  For record criteria, a record matches when its start/end overlaps
  [start, end]. A record with no time never matches a time-bounded rule.
  """
  start: DateTime

  """Exclusive end of the rule (ISO 8601). Null means unbounded."""
  end: DateTime
}

"""A position criterion of an exclusion rule."""
input PositionExclusionInput {
  """ID of the Location in the LocationTree hierarchy."""
  locationId: ID!

  """
  ID of the Layout in the LayoutTree hierarchy.
  
  When null, any position at the location matches.
  """
  layoutId: ID

  """
  Axis values to match.
  
  When null, any position in the layout matches.
  Otherwise only the given axes are matched.
  """
  axes: [AxisValueInput!]
}

"""The value of a layout axis."""
input AxisValueInput {
  """Index of the axis in the layout."""
  index: Int!

  """Value of the coordinate on the axis."""
  value: String!
}

"""
Configuration for analysis of variance.

The supplied terms define the variables available to the analysis.
Grouping defines the analytical observations on which the model operates.

Models with only fixed effects are fitted as linear models. Models with
any RANDOM term are fitted as linear mixed models; crossed random effects
are supported.
"""
input AnovaInput {
  """
  Terms used by the analysis.
  
  Includes the response term.
  """
  terms: [AnalysisTermInput!]!

  """
  The response term.
  
  Must reference a CONCEPT term in terms, represented as CONTINUOUS,
  with no effect.
  """
  response: AnalysisTermReferenceInput!

  """Dimensions used to construct analytical observations."""
  grouping: AnalysisGroupingInput

  """Interactions between analysis terms."""
  interactions: [InteractionTermInput!]

  """Significance level used for hypothesis testing."""
  alpha: Float = 0.05

  """Type of sums of squares. Type III uses sum-to-zero contrasts."""
  sumOfSquares: SumOfSquaresType = TYPE_III

  """Denominator degrees of freedom method for mixed models."""
  ddf: DdfMethod = SATTERTHWAITE

  """Optional estimated marginal means and contrasts."""
  estimatedMeans: [EstimatedMeansInput!]
}

"""
Configuration for correlation analysis.

A correlation matrix is calculated for the supplied terms across
the analytical observations defined by grouping.
"""
input CorrelationInput {
  """Terms included in the correlation matrix."""
  terms: [AnalysisTermInput!]!

  """Dimensions used to construct analytical observations."""
  grouping: AnalysisGroupingInput

  """Correlation method."""
  method: CorrelationMethod!
}

"""Configuration for descriptive statistics."""
input DescriptiveStatisticsInput {
  """Terms for which descriptive statistics are calculated."""
  terms: [AnalysisTermInput!]!

  """Dimensions used to construct analytical observations."""
  grouping: AnalysisGroupingInput

  """
  Optional interactions between analysis terms when model-dependent
  statistics are requested.
  """
  interactions: [InteractionTermInput!]

  """Optional estimated marginal means (least-squares means)."""
  estimatedMeans: [EstimatedMeansInput!]
}

"""Configuration for multidimensional scaling."""
input MDSInput {
  """Data used to construct analytical observations."""
  terms: [AnalysisTermInput!]!

  """ Dimensions used to construct analytical observations. """
  grouping: AnalysisGroupingInput

  """Distance metric used to calculate dissimilarity."""
  distance: DistanceMetric!

  """Number of dimensions to produce."""
  dimensions: Int = 2

  """
  Optional clustering performed using the same analytical
  observations represented by the MDS analysis.
  """
  clustering: MDSClusteringInput
}

"""
Optional clustering of the analytical observations represented
by an MDS analysis.

Clustering operates on the same analytical observations used
to calculate the MDS representation.
"""
input MDSClusteringInput {
  """Clustering method."""
  method: ClusteringMethod!

  """Number of clusters when required by the selected method."""
  clusters: Int
}

"""
Configuration for outlier detection.

Outlier detection identifies observations that may be excluded from
subsequent analyses.
"""
input OutlierDetectionInput {
  """Terms used to identify potential outliers."""
  terms: [AnalysisTermInput!]!

  """Dimensions used to construct analytical observations."""
  grouping: AnalysisGroupingInput

  """Method used to identify potential outliers."""
  method: OutlierDetectionMethod!
}

"""Identifies a term used by an analysis."""
input AnalysisTermReferenceInput {
  """Type of term."""
  type: AnalysisTermType!

  """Stable concept ID when type is CONCEPT."""
  conceptId: ID

  """
  Name of a dimension in grouping.recordGroups when type is RECORD_GROUP.
  """
  recordGroupDimension: String

  """Name of an axis in grouping.position.axes when type is LAYOUT_AXIS."""
  layoutAxis: String
}

"""
Defines a term used by an analysis.

A term may represent a concept or a domain dimension such as
time, germplasm, unit, position, record group or study.
"""
input AnalysisTermInput {
  """Identifies the type and identity of the term."""
  reference: AnalysisTermReferenceInput!

  """
  Defines how concept values are represented.
  
  Not applicable to domain dimensions.
  """
  representation: TermRepresentationType

  """
  Optional binning applied to the term.
  
  Supported for numeric, temporal and duration values where
  applicable.
  """
  binning: BinningInput

  """
  Explicit ordering of categorical levels.
  
  Used when a categorical concept is represented as ORDINAL.
  """
  levelOrder: [String!]

  """Transformations applied to the term values, in order."""
  transformations: [TermTransformation!]

  """
  Defines how multiple records contributing to an analytical
  observation are aggregated.
  """
  aggregation: TermAggregation

  """
  Combines the replicates of each reading before the term's aggregation.
  
  Without it, replicates in one observation are duplicates,
  which fail under NONE or are pooled by the term's aggregation.
  """
  replicateAggregation: ReplicateAggregationInput

  """Statistical effect of the term when a statistical model is used."""
  effect: TermEffect

  """Terms whose effects may vary as random slopes for this term."""
  randomSlopeTerms: [AnalysisTermReferenceInput!]
}

"""
Defines an interaction between two or more analysis terms.

Each term may represent a concept or a domain dimension such as
time, germplasm, unit, position, record group or study.
"""
input InteractionTermInput {
  """
  Terms participating in the interaction.
  
  The server validates that the referenced terms exist in the
  analysis terms and that the requested interaction is supported
  by the selected analysis.
  """
  terms: [AnalysisTermReferenceInput!]!
}

"""
Combines the replicates of each reading before a term's aggregation.

Replicates are records of the same base unit with codes of the same
WITHIN_UNIT record groupings and scopes. A reading is the replicates with the
same start and end or, with a window, those within the window of the reading's
first record (by start, or end without a start). Readings never span observations,
so time bins (grouping.time) still separate them.
"""
input ReplicateAggregationInput {
  """MEAN, MEDIAN, MIN, MAX or MODE; NONE, SUM and COUNT are not accepted."""
  aggregation: TermAggregation!

  """
  ISO 8601 duration a reading spans from its first record, e.g. PT5M or P1D.
  """
  window: String
}

"""
A Person to credit, with the Role entries for what they did; roles may be left out and declared later.
"""
input ContributionInput {
  personId: ID!
  roleIds: [ID!]
}

input ControlledEntityInput {
  label: ControlledModelLabel!
  id: ID!
}

"""
Every entity of a label that a team controls, in place of listing them, for acting on many at once: at a release
when given, and for units only those at and below some units when given. The user must be an admin of the team.
"""
input ControlScopeInput {
  teamId: ID!
  label: ControlledModelLabel!

  """Only those at this release, as the team set it"""
  release: ReadRelease

  """Units only: these units and those below them"""
  belowUnitIds: [ID!]
}

input ControlTransferOffer {
  """
  Controlled models to transfer, or a scope. Each is transferred alone, not with other models in its aggregate
  """
  entities: [ControlledEntityInput!]

  """
  In place of entities: everything a team controls of a label (at a release, below some units)
  """
  scope: ControlScopeInput

  """
  Teams giving up control. The user must be an admin of each, and each must control every entity
  """
  fromTeamIds: [ID!]!

  """The team offered control, e.g. the root of another team tree"""
  recipientTeamId: ID!

  """
  Keep control for the teams giving it, sharing control with the teams taking it
  """
  keepFromTeams: Boolean

  """
  Only when the user is also an admin of the recipient team: the teams taking control.
  The transfer is then accepted immediately.
  """
  toTeamIds: [ID!]

  """
  Only with toTeamIds: the release level of the new controls. Defaults to PRIVATE
  """
  release: ReadRelease
}

input RecordGroupInput {
  id: ID!
  code: String!
}

input RecordInput {
  """ The unit the record is of, which the user must be able to read """
  unitId: ID!
  value: String
  start: DateTime
  end: DateTime
  groups: [RecordGroupInput!]
  referenceIds: [ID]
}

"""A record's changes: a field not given is left as it is"""
input RecordUpdate {
  id: ID!

  """ Moves the record to this unit, which the user must be able to read """
  unitId: ID
  value: String

  """ Given as null, the record's start is removed """
  start: DateTime

  """ Given as null, the record's end is removed """
  end: DateTime
  groups: [RecordGroupInput!]
  referenceIds: [ID]
}

input DatasetInput {
  studyId: ID!

  """ concept is either a Factor or Variable in the ontology """
  conceptId: ID!
  records: [RecordInput!]!
  contributions: [ContributionInput!]
  referenceIds: [ID!]
}

input DatasetUpdate {
  """Optionally provide a list of records to update"""
  id: ID!
  studyId: ID
  conceptId: ID
  records: [RecordUpdate!]!
  contributions: [ContributionInput!]
  referenceIds: [ID!]
}

enum Reproduction {
  CLONAL
  SEXUAL
  APOMIXIS
}

enum GermplasmSourceType {
  UNKNOWN
  SEED
  TISSUE
  MATERNAL
  PATERNAL
}

input GermplasmSourceRelationship {
  sourceId: ID!
  sourceType: GermplasmSourceType!
  description: String
}

input GermplasmInput {
  name: String!
  description: String
  synonyms: [String!]

  """Place of origin, a reference to a Location stored in Location trees"""
  originId: ID

  """Time sourced from origin"""
  time: DateTime

  """
  The unit it came from, a reference to a Unit in a unit graph, for germplasm produced by the breeding recorded here:
  e.g. the plant a selection was made from, or the seed of a cross
  """
  unitId: ID

  """
  Reproduction of germplasm, summarises the genetic impacts/requirements for maintenance
  """
  reproduction: Reproduction

  """
  Control methods (referenced in the ontology) to provide further details about how this germplasm is maintained
  """
  controlMethodIds: [ID!]

  """References for ths germplasm entry (A list of referenceId)"""
  referenceIds: [ID!] = []

  """Source relationships"""
  sources: [GermplasmSourceRelationship!]
}

"""
Fields left out are unchanged; null, or an empty string, clears description, time or reproduction, and null or an
empty list clears synonyms; null removes originId or unitId
"""
input GermplasmUpdate {
  id: ID!
  name: String
  description: String
  synonyms: [String!]

  """ Omitted, the origin is unchanged; null removes it """
  originId: ID
  time: DateTime

  """ Omitted, the unit is unchanged; null removes it """
  unitId: ID
  reproduction: Reproduction
  controlMethodIds: [ID!]
  referenceIds: [ID!]
  sources: [GermplasmSourceRelationship!]
}

input LayoutInput {
  """ Location ID from LocationTree, provide this only for the root layout in a layout tree 
  """
  locationId: ID

  """ Ontology LayoutType identifier """
  typeId: ID!

  """ Axis labels """
  axes: [String!]

  """ Optional name for the layout """
  name: String

  """ Optional parent layout to construct multiplexed layout layout trees"""
  parentId: ID

  """ When parent is supplied, position according to parent layout axes must be provided.
  """
  position: [String]
}

"""
Fields left out are unchanged; null, or an empty string, clears the name; the other fields left out or null are
unchanged
"""
input LayoutUpdate {
  id: ID

  """ Location ID from LocationTree, provide this only for the root layout in a layout tree 
  """
  locationId: ID
  typeId: ID
  axes: [String!]
  name: String
  parentId: ID
  position: [String]
}

""" A licence, and the contentHash of the text accepted """
input LicenceAcceptanceInput {
  id: ID!
  contentHash: String!
}

input GeoCoordinateInput {
  """Latitude in degrees according to ISO 6709"""
  latitude: Float!

  """Longitude in degrees according to ISO 6709"""
  longitude: Float!

  """Meters above WGS84 reference ellipsoid"""
  altitude: Float

  """UncertaIDy in meters associated with these coordinates"""
  uncertainty: Float

  """Additional coordinate description"""
  description: String
}

input LocationInput {
  name: String!

  """ Optional code for location, e.g. zip-code """
  code: String
  description: String
  address: String
  coordinates: [GeoCoordinateInput]

  """ Ontology LocationType identifier """
  typeId: ID!

  """ A parent location, required unless a country (see countries) """
  parentId: ID
}

"""
Fields left out are unchanged; null, or an empty string, clears an optional one (all but name, typeId and parentId; a
country keeps its code)
"""
input LocationUpdate {
  id: ID!
  name: String

  """ Optional code for location, e.g. zip-code """
  code: String
  description: String
  address: String
  coordinates: [GeoCoordinateInput]

  """ Ontology LocationType identifier """
  typeId: ID

  """ A parent location, required unless a country (see countries) """
  parentId: ID
}

type Mutation {
  """
  Register, with the token from an invitation link, and the email address invited. The site's first account, which
  invites the others, is made on the server (scripts/create_first_account.py).
  """
  accountsCreateAccount(
    name: String!
    fullname: String
    email: String!
    password: String!

    """ Consent to the processing of the user's personal data as the BreedGraph privacy notice describes. Required to be true 
    """
    privacyConsent: Boolean!
    invitationToken: String

    """ Teams offered with the invitation to accept, with every access offered to each. Others are declined 
    """
    acceptTeamIds: [ID!]

    """
    Link the Person offered with the invitation to the new account.
    Before the user confirms, tell them that other users may message them through BreedGraph
    if the Person is listed as a contact, at their account email address, which senders never see.
    They can remove themselves as a contact, and unlink or erase the Person, at any time.
    """
    linkPerson: Boolean
  ): BooleanPayload!

  """
  Change the user's own details. A new password ends their sign-ins elsewhere, and signs this browser in again; a new
  email address is set once its verification link is followed.
  """
  accountsUpdateUser(
    name: String
    fullname: String
    email: String
    password: String

    """ The user's current password, required to change their password or email address. Failures count towards the login lockout 
    """
    currentPassword: String
  ): BooleanPayload!
  accountsVerifyEmail(token: String!): BooleanPayload!
  accountsRequestPasswordReset(email: String!): BooleanPayload
  accountsResetPassword(token: String!, password: String!): BooleanPayload!
  accountsLogin(username: String!, password: String!): BooleanPayload!
  accountsLogout: BooleanPayload!

  """
  Delete your own account, confirming with your password, and log out.
  Your contributions stay attributed to an anonymous user id.
  Refused while you are the only ontology admin or the only admin of a team.
  Before the user confirms, ask whether to erase their linked Person as well, with erasing as the default.
  """
  accountsDeleteAccount(
    password: String!

    """ Erase the linked Person (the default), otherwise only unlink it """
    erasePerson: Boolean = true
  ): BooleanPayload!

  """
  Invite someone to register. Teams must be administered by the inviting user, who can offer one or more
  accesses to each, and a Person must be controlled by a team they administer.
  """
  accountsInvite(email: String!, teams: [TeamInvitationInput!], personId: ID): BooleanPayload!
  accountsCancelInvitation(id: ID!): BooleanPayload!

  """ Send the invitation again, extending its expiry """
  accountsResendInvitation(id: ID!): BooleanPayload!

  """
  Ask a team's admins for an affiliation, heritable by default. With an authorised affiliation to the team only,
  ask for it to be made heritable: it stays as it is until they decide. An admin's own request is authorised at once,
  unless it is heritable and they are not an admin for every team below.
  """
  accountsRequestAffiliation(teamId: ID!, access: Access!, heritable: Boolean): BooleanPayload!

  """
  Authorise a user's affiliation to a team the user administers, heritable only by an admin for every team below.
  Authorising an affiliation the user holds to the team only answers their request to make it heritable with no.
  """
  accountsApproveAffiliation(userId: ID!, teamId: ID!, access: Access!, heritable: Boolean): BooleanPayload!
  accountsRemoveAffiliation(teamId: ID!, access: Access!): BooleanPayload!

  """
  Limit the user's own affiliation to the team, with no approval needed, or withdraw their request to make it
  heritable. Refused for read access while curate or admin access is heritable, and for the last heritable admin of a
  team tree's root.
  """
  accountsRemoveHeritability(teamId: ID!, access: Access!): BooleanPayload!
  accountsRevokeAffiliation(userId: ID!, teamId: ID!, access: Access!): BooleanPayload!
  accountsRequestOntologyRole(ontologyRole: OntologyRole!): BooleanPayload!
  accountsSetOntologyRole(userId: ID!, ontologyRole: OntologyRole!): BooleanPayload!
  accountsSetWriteTeam(
    """ Set the default write team to ensure this team comes first in the write teams list 
    """
    teamId: ID!
  ): BooleanPayload!

  """
  Submit an analysis request.
  
  The returned ID can be used with the analysisSubmission query
  to retrieve the processing status and result.
  """
  analysisSubmit(analysis: AnalysisInput!): AnalysisSubmissionIdPayload!

  """
  Delete an analysis, including its result.
  A queued or running analysis is cancelled.
  """
  analysisDelete(id: ID!): BooleanPayload!

  """
  Set the release of entities, for the teams controlling them that the user is an admin of: give entityLabel and
  entityIds, or a scope
  """
  controlsSetRelease(entityLabel: ControlledModelLabel, entityIds: [ID!], scope: ControlScopeInput, release: ReadRelease!): BooleanPayload!

  """Offer control of controlled models to a recipient team"""
  controlsOfferTransfer(offer: ControlTransferOffer!): BooleanPayload!

  """
  Accept a transfer offered to a team the user is an admin of.
  toTeamIds must be the recipient team or teams below it, each administered by the user.
  """
  controlsAcceptTransfer(id: ID!, toTeamIds: [ID!]!, release: ReadRelease): BooleanPayload!

  """Reject a transfer offered to a team the user is an admin of"""
  controlsRejectTransfer(id: ID!): BooleanPayload!

  """Cancel a pending transfer offered from teams the user is an admin of"""
  controlsCancelTransfer(id: ID!): BooleanPayload!

  """
  End the control of teams the user is an admin of, where other teams also control the entities: give the
  entities, or a scope
  """
  controlsRenounceControl(entities: [ControlledEntityInput!], scope: ControlScopeInput, teamIds: [ID!]!): BooleanPayload!

  """
  Submission Payloads include a key, the data is processed asynchronously
  Poll the datasetsSubmission using the returned submission ID for status reports.
  """
  datasetsCreate(dataset: DatasetInput!, controlTeamId: ID!, release: ReadRelease): SubmissionIdPayload!
  datasetsUpdate(dataset: DatasetUpdate!): SubmissionIdPayload!
  datasetsAddRecords(id: ID!, records: [RecordInput!]): SubmissionIdPayload!

  """Delete records from a dataset"""
  datasetsRemoveRecords(id: ID!, recordIds: [ID!]!): BooleanPayload!
  germplasmCreateEntry(entry: GermplasmInput!, controlTeamId: ID!, release: ReadRelease): BooleanPayload
  germplasmUpdateEntry(entry: GermplasmUpdate!): BooleanPayload
  germplasmDeleteEntry(id: ID!): BooleanPayload
  layoutsCreateLayout(layout: LayoutInput!, controlTeamId: ID!, release: ReadRelease): BooleanPayload!
  layoutsUpdateLayout(layout: LayoutUpdate!): BooleanPayload!
  layoutsDeleteLayout(id: ID!): BooleanPayload!

  """
  Accept study licences, each named by its id and the contentHash of the text read; refused for any that changed
  since, or that the user can't read. Kept in the same cookie as the Terms of Use, for the user, or for a visitor who
  isn't signed in, and nothing is stored about who accepted (docs/licences.md §5)
  """
  licencesAccept(licences: [LicenceAcceptanceInput!]!): BooleanPayload!
  locationsCreateLocation(location: LocationInput!, controlTeamId: ID!, release: ReadRelease): BooleanPayload!
  locationsUpdateLocation(location: LocationUpdate!): BooleanPayload!
  locationsDeleteLocation(id: ID!): BooleanPayload!
  ontologyCreateTerm(term: TermInput!): BooleanPayload!
  ontologyCreateSubject(subject: SubjectInput!): BooleanPayload!
  ontologyCreateTrait(trait: TraitInput!): BooleanPayload!
  ontologyCreateCondition(condition: ConditionInput!): BooleanPayload!
  ontologyCreateScale(scale: ScaleInput!): BooleanPayload!
  ontologyCreateObservationMethod(observationMethod: ObservationMethodInput!): BooleanPayload!
  ontologyCreateVariable(variable: VariableInput!): BooleanPayload!
  ontologyCreateControlMethod(controlMethod: ControlMethodInput!): BooleanPayload!
  ontologyCreateFactor(factor: FactorInput!): BooleanPayload!
  ontologyCreateEvent(event: EventInput!): BooleanPayload!
  ontologyCreateLocationType(locationType: LocationTypeInput!): BooleanPayload!
  ontologyCreateDesign(design: DesignInput!): BooleanPayload!
  ontologyCreateRole(role: RoleInput!): BooleanPayload!
  ontologyCreateRecordGroupType(recordGroupType: RecordGroupTypeInput!): BooleanPayload!
  ontologyCreateLayoutType(layoutType: LayoutTypeInput!): BooleanPayload!
  ontologyUpdateTerm(term: TermUpdate!): BooleanPayload!
  ontologyUpdateSubject(subject: SubjectUpdate!): BooleanPayload!
  ontologyUpdateTrait(trait: TraitUpdate!): BooleanPayload!
  ontologyUpdateCondition(condition: ConditionUpdate!): BooleanPayload!
  ontologyUpdateScale(scale: ScaleUpdate!): BooleanPayload!
  ontologyUpdateObservationMethod(observationMethod: ObservationMethodUpdate!): BooleanPayload!
  ontologyUpdateVariable(variable: VariableUpdate!): BooleanPayload!
  ontologyUpdateControlMethod(controlMethod: ControlMethodUpdate!): BooleanPayload!
  ontologyUpdateFactor(factor: FactorUpdate!): BooleanPayload!
  ontologyUpdateEvent(event: EventUpdate!): BooleanPayload!
  ontologyUpdateLocationType(locationType: LocationTypeUpdate!): BooleanPayload!
  ontologyUpdateDesign(design: DesignUpdate!): BooleanPayload!
  ontologyUpdateRole(role: RoleUpdate!): BooleanPayload!
  ontologyUpdateRecordGroupType(recordGroupType: RecordGroupTypeUpdate!): BooleanPayload!
  ontologyUpdateLayoutType(layoutType: LayoutTypeUpdate!): BooleanPayload!

  """ Lock entries so they stay stable, or unlock them; for ontology admins 
  """
  ontologyLockEntries(ids: [ID!]!): BooleanPayload!
  ontologyUnlockEntries(ids: [ID!]!): BooleanPayload!
  ontologyDeprecateEntries(ids: [ID!]!): BooleanPayload!
  ontologyCancelDeprecateEntries(ids: [ID!]!): BooleanPayload!

  """
  Bring removed entries back as drafts, which the next commit activates, with the relationships removed with them;
  each keeps its id. For ontology editors and admins. Refused while another entry has the name, or without the entries
  one is defined by.
  """
  ontologyRestoreEntries(ids: [ID!]!): BooleanPayload!

  """
  Commit the drafts as a new version. The licence and copyright must be public references. The version keeps the
  latest version's licence unless licenceId names another, so the ontology's licence can be changed but not removed.
  """
  ontologyCommitVersion(versionChange: VersionChange!, comment: String, licenceId: ID, copyrightId: ID): BooleanPayload!

  """
  Record a Person. Its release can be at most REGISTERED: Persons are never shown to anonymous users.
  """
  peopleCreatePerson(person: PersonInput!, controlTeamId: ID!, release: ReadRelease): BooleanPayload!

  """
  Curators of the record can change all fields. The linked user can change the name and institution
  """
  peopleUpdatePerson(person: PersonUpdate!): BooleanPayload!

  """
  Remove identifying data, keeping the id so contributions stay attributed.
  By admins of the controlling teams or the linked user. Cannot be undone.
  """
  peopleErasePerson(id: ID!): BooleanPayload!

  """
  Ask to link the current user's account to a Person, for admins of its controlling teams to approve.
  Before the user confirms, tell them that other users may message them through BreedGraph
  if the Person is listed as a contact, at their account email address, which senders never see.
  They can remove themselves as a contact, and unlink or erase the Person, at any time.
  """
  peopleRequestClaim(personId: ID!): BooleanPayload!
  peopleWithdrawClaim(personId: ID!): BooleanPayload!

  """ Link the requesting user to the Person. By admins of its controlling teams, who should confirm the user's identity 
  """
  peopleApproveClaim(personId: ID!, userId: ID!): BooleanPayload!
  peopleRejectClaim(personId: ID!, userId: ID!): BooleanPayload!

  """ Remove the link between a Person and an account. By the linked user or admins of its controlling teams 
  """
  peopleUnlinkPerson(personId: ID!): BooleanPayload!

  """ Stop being a contact of a Program or Trial. By the user linked to the contact Person 
  """
  peopleRemoveSelfAsContact(entityLabel: ControlledModelLabel!, entityId: ID!): BooleanPayload!

  """
  Start verifying the user's ORCID iD for their linked Person. Returns the ORCID sign-in URL to send the browser to.
  ORCID then redirects to the configured ORCID_REDIRECT_URI, a front-end page, adding id_token and state to its
  fragment (with an access token, which is not needed).
  """
  peopleStartOrcidLink: StringPayload!

  """
  Complete the ORCID sign-in with the id_token and state from the redirect, storing the verified ORCID iD.
  The id_token is checked against ORCID's key held on the server, so the API does not contact ORCID.
  """
  peopleCompleteOrcidLink(idToken: String!, state: String!): BooleanPayload!

  """ Remove the ORCID iD from the user's linked Person """
  peopleRemoveOrcid: BooleanPayload!

  """
  Send a message to a contact of a Program or Trial the sender can read (entityLabel PROGRAM or TRIAL).
  BreedGraph emails the linked user without revealing their address. The sender's name and email address
  are included, so the recipient can reply: tell the sender this before sending.
  Messages are rate limited per sender and limited in length.
  """
  peopleContactPerson(personId: ID!, entityLabel: ControlledModelLabel!, entityId: ID!, subject: String!, message: String!): BooleanPayload!
  programsCreateProgram(program: ProgramInput!, controlTeamId: ID!, release: ReadRelease): BooleanPayload!
  programsUpdateProgram(program: ProgramUpdate!): BooleanPayload!
  programsDeleteProgram(id: ID!): BooleanPayload!
  programsCreateTrial(trial: TrialInput!, controlTeamId: ID!, release: ReadRelease): BooleanPayload!
  programsUpdateTrial(trial: TrialUpdate!): BooleanPayload!
  programsDeleteTrial(id: ID!): BooleanPayload!
  programsCreateStudy(study: StudyInput!, controlTeamId: ID!, release: ReadRelease): BooleanPayload!
  programsUpdateStudy(study: StudyUpdate!): BooleanPayload!
  programsDeleteStudy(id: ID!): BooleanPayload!
  programsCreateGrouping(grouping: GroupingInput!): BooleanPayload!
  programsUpdateGrouping(grouping: GroupingUpdate!): BooleanPayload!
  programsDeleteGrouping(id: ID!): BooleanPayload!

  """
  Merging scopes
  If any of the datasetIds provided are in an existing scope,
  all datasetIds will be added to that scope.
  Otherwise, a new scope will be created.
  """
  programsMergeScope(groupingId: ID!, datasetIds: [ID!]): BooleanPayload!
  referencesCreateLegal(reference: LegalReferenceInput!, controlTeamId: ID!, release: ReadRelease): CreatedIdPayload!
  referencesCreateExternal(reference: ExternalReferenceInput!, controlTeamId: ID!, release: ReadRelease): CreatedIdPayload!
  referencesCreateExternalData(reference: ExternalDataReferenceInput!, controlTeamId: ID!, release: ReadRelease): CreatedIdPayload!

  """
  As for dataset submissions, creating a file is asynchronous and we are returned a key 
  """
  referencesCreateFile(reference: FileReferenceInput, controlTeamId: ID!, release: ReadRelease): FileIdPayload!
  referencesCreateDataFile(reference: DataFileReferenceInput, controlTeamId: ID!, release: ReadRelease): FileIdPayload!

  """
  A legal reference with the text of a .txt, .md or .pdf file. Returns the key that follows the file's saving, as for
  referencesCreateFile; the reference and its text exist at once
  """
  referencesCreateLegalFile(reference: LegalFileReferenceInput!, controlTeamId: ID!, release: ReadRelease): FileIdPayload!
  referencesUpdateLegal(reference: LegalReferenceUpdate!): BooleanPayload!

  """ New text from a file, applied with the file once it is saved; returns the key that follows the saving 
  """
  referencesUpdateLegalFile(reference: LegalFileReferenceUpdate!): FileIdPayload!
  referencesUpdateExternal(reference: ExternalReferenceUpdate!): BooleanPayload!
  referencesUpdateExternalData(reference: ExternalDataReferenceUpdate!): BooleanPayload!
  referencesUpdateFile(reference: FileReferenceUpdate): FileIdPayload!
  referencesUpdateDataFile(reference: DataFileReferenceUpdate): FileIdPayload!
  referencesDelete(ids: [ID!]!): BooleanPayload!

  """ Request to make an archived file available for download """
  referencesRequestFileRetrieval(fileId: ID!): BooleanPayload!
  teamsCreateTeam(team: TeamInput!): BooleanPayload!
  teamsDeleteTeam(id: ID!): BooleanPayload!
  teamsUpdateTeam(team: TeamUpdate!): BooleanPayload!

  """
  Accept the Terms of Use, named by their contentHash; refused if they have changed since they were read. Everything
  but reading and accepting the Terms, and introspection, is refused until they are accepted (TERMS_NOT_ACCEPTED).
  The acceptance is kept in a cookie for the user, or for a visitor who isn't signed in, and nothing is stored about
  who accepted.
  """
  termsAccept(contentHash: String!): BooleanPayload!
  unitsCreateUnit(unit: UnitInput!, controlTeamId: ID!, release: ReadRelease, position: PositionInput): BooleanPayload!
  unitsUpdateUnit(unit: UnitUpdate!): BooleanPayload!
  unitsDeleteUnit(id: ID!): BooleanPayload!
  unitsAddPosition(id: ID!, position: PositionInput!): BooleanPayload!
  unitsRemovePosition(id: ID!, position: PositionInput!): BooleanPayload!

  """
  Moves the units to the position from its start, e.g. an arrival's samples on to another lab: each unit's own
  positions holding then end at that start (unless they end by then), and the position is added. Refused for a unit
  with a position from that start or later, and unless you curate every unit. Returns the units moved.
  """
  unitsMoveUnits(units: UnitsSelection!, position: PositionInput!): UnitsPayload!

  """
  Places each unit at a position of its own from its start, e.g. a trial's plots in its layout as planted, as
  unitsMoveUnits moves units to one; a unit already at its place then stays as it is. Sets each unit's germplasm
  where given. All or none, up to 1000 units, each once: refused for a unit with a position from its start or later,
  and unless you curate every unit and can read the germplasm given. Returns the units, in the order given.
  """
  unitsPlaceUnits(placements: [UnitPlacementInput!]!): UnitsPayload!

  """
  Changes one position of each unit, the one matching at, e.g. to end an arrival there or correct its start: refused
  where a unit has none or several matching, unless you curate every unit. Returns the units changed.
  """
  unitsChangePositions(units: UnitsSelection!, at: PositionMatchInput!, change: PositionChangeInput!): UnitsPayload!

  """
  Creates a unit derived from each of the units, e.g. plantlets in a field from the microcuttings of an arrival:
  each a child of parentIds (e.g. a field-season unit), or with no parents the root of a unit graph of its own at
  the position. Each takes its source's name and subject (or subjectId), and as its germplasm germplasmId if given,
  else with copyGermplasm the germplasm its source has or takes from the units above it, where you can read it,
  else none. Set them apart afterwards with unitsUpdateUnit, and the positions of each with unitsAddPosition. The
  units derived from are left as they are: end or move them with unitsChangePositions or unitsMoveUnits. Needs read
  access to every unit, and to the germplasm given. Returns the units created, in the order of the units they came
  from.
  """
  unitsDeriveUnits(units: UnitsSelection!, parentIds: [ID!], position: PositionInput, subjectId: ID, stage: DerivationStage = UNKNOWN, description: String, germplasmId: ID, copyGermplasm: Boolean = true, controlTeamId: ID!, release: ReadRelease): UnitsPayload!

  """
  Adds count children (1 to 100) of the subject to each of the parents in one go, all or none, e.g. three leaf
  samples from each tree of a field on the day they were taken. Each is named from the template: {parent} is its
  parent's name (or its subject and id), {subject} the subject's name and {n} its number among its parent's new
  children, from 1, so the default names the first leaf of Tree 1 "Tree 1 - Leaf 1"; null leaves them unnamed. With
  more than one child to each parent, the name needs {n}. With a start, each child has a position at its parent's
  place then, its own or the one it takes from the units above it, from then: refused for a parent whose place then
  can't be told, its lineages differing or hidden. Without one, the children are where their parents are. Their
  germplasm is the one given, else what they take from their parents. Needs read access to every parent, and to the
  germplasm given. Returns the children, by parent in the order given.
  """
  unitsAddChildren(parents: UnitsSelection!, subjectId: ID!, count: Int = 1, name: String = "{parent} - {subject} {n}", description: String, germplasmId: ID, start: DateTime, controlTeamId: ID!, release: ReadRelease): UnitsPayload!
}

