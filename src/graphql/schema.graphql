type Query {
  """Get own account details for administrative tasks"""
  accountsAccount: AccountPayload!

  """Get the user access map of access type to team"""
  accountsUserAccess: UserAccessPayload!

  """
  The roots of the team trees, which every signed-in user sees.
  Teams below a root are visible to their affiliates only (docs/read-access.md, rule 9).
  Navigation of the team tree graph is achieved by resolvers on the parent/children attributes. Requires sign-in.
  """
  teamsRoots: TeamsPayload!

  """
  A team by id; a placeholder for a team hidden from the user.
  As with team trees, the team tree can be explored from this node. Requires sign-in.
  """
  teamsTeam(id: ID!): TeamPayload!

  """Teams by id, as teamsTeam. Requires sign-in."""
  teamsTeams(ids: [ID!]): TeamsPayload!

  """ What an invitation offers, for the registration form. Requires the token from the invitation link, not login 
  """
  accountsInvitation(token: String!): InvitationPreviewPayload!

  """ Persons the user can see in full or by attribution, optionally by exact name (case insensitive). Requires sign-in 
  """
  people(name: String): PeoplePayload!

  """ Get Persons by id, each in the user's view of it (Person.view). Requires sign-in 
  """
  peoplePeople(ids: [ID!]!): PeoplePayload!

  """ Get a Person by id, in the user's view of it (Person.view). Requires sign-in 
  """
  peoplePerson(id: ID!): PersonPayload!

  """ The Person linked to the current user's account, if any """
  peopleMyPerson: PersonPayload!

  """ The current user's pending requests to be linked to a Person """
  peopleMyClaims: PersonClaimsPayload!

  """
  Whether users can link a verified ORCID iD on this site: whether its ORCID Public API client is configured
  (docs/person.md, ORCID). Not on the demonstration site, which has none. Requires sign-in
  """
  peopleOrcidLinking: BooleanPayload!

  """ Pending requests to be linked to Persons controlled by teams the current user administers 
  """
  peopleClaimRequests: PersonClaimRequestsPayload!

  """Get the latest ontology version"""
  ontologyVersion: VersionPayload!

  """
  Get the complete ontology at a given version for editing.
  Defaults to latest version with view PUBLISHED.
  Supports PUBLISHED and EDITORIAL views.
  """
  ontology(versionId: ID, view: OntologyView = PUBLISHED): OntologyPayload!

  """
  Get a list of ontology entries.
  Supports all views.
  Defaults to latest version with view PUBLISHED.
  """
  ontologyEntries(
    """Snapshot:"""
    versionId: ID
    view: OntologyView = PUBLISHED

    """Filters (at least one is required)"""
    ids: [ID!]
    labels: [OntologyNodeLabel!]
  ): OntologyEntriesPayload!

  """
  Get relationships for entries to update a retrieved ontology without refetching the whole ontology.
  Supports PUBLISHED and EDITORIAL views.
  Defaults to latest version with view PUBLISHED.
  """
  ontologyRelationships(
    """Snapshot"""
    versionId: ID
    view: OntologyView = PUBLISHED

    """Filters"""
    entryIds: [ID!]!
  ): OntologyRelationshipsPayload!

  """Get ontology commit history, use lastVersionId to paginate"""
  ontologyCommitHistory(limit: Int, lastVersionId: ID): OntologyCommitsPayload!

  """
  Get a list of users requesting new ontology roles.
  Only available to Users with the admin ontology role.
  """
  ontologyRoleRequests: UsersPayload!

  """
  Get a list of Ontology Editors
  Only available to Users with the admin ontology role.
  """
  ontologyEditors: UsersPayload!

  """
  Get a list of Ontology Admins
  Only available to Users with the admin ontology role.
  """
  ontologyAdmins: UsersPayload!

  """
  Get a list of country templates for use in top level location tree creation
  """
  locationsCountries: LocationTemplatesPayload!

  """
  The locations the user can read whose name contains name, ignoring case, those whose name starts with it first,
  then by name: at most limit (10 by default, 50 at most)
  """
  locationsSearch(name: String!, limit: Int): LocationsPayload!

  """
  Places matching a search, to move the location map to (docs/maps.md): GeoNames' places, answered from this
  server's copy, so no search leaves it. Whole names first, then names started, then other names (in other
  languages, or older), preferring those in viewbox ([west, south, east, north]), or only those there when bounded,
  and only those in the country with ISO 3166 alpha-3 code country when given; later words may name the place's
  county, province or country. The towns of the world are searched, and every place of the countries in the location
  trees. At most limit (5 by default, 20 at most), and at most 5 searches in a request. Open to visitors.
  """
  locationsSearchPlaces(query: String!, viewbox: [Float!], bounded: Boolean, country: String, limit: Int): PlacesPayload!

  """
  The country with this ISO 3166 alpha-3 code, with the extent of its main parts, to show it by when its detailed
  maps give none (null until the world's places are fetched). Open to visitors
  """
  locationsCountryPlace(code: String!): PlacePayload!

  """
  Where the detailed maps of the country with this ISO 3166 alpha-3 code stand on this site (docs/maps.md): fetched
  in the background once the country is added, or for a country too large to fetch whole, by its sections as
  locations in them are placed on the map; and where its places for the place search stand
  """
  locationsMapStatus(code: String!): CountryMapStatusPayload!

  """
  Get a list of location tree "root" locations.
  These are all countries that form the top-level location in the location tree.
  """
  locationsRoots: LocationsPayload!

  """ Get locations by locationId """
  locationsLocations(ids: [ID!]!): LocationsPayload!

  """ Search for locations by ontology Location type """
  locationsLocationsByType(locationTypeId: ID!): LocationsPayload!

  """
  Every readable location below the given locations, grouped by location type, as id and name.
  For selecting all the locations of a type at once.
  """
  locationsDescendantsByType(locationIds: [ID!]!): LocationTypeLocationsPayload!

  """
  Get a list of layout tree roots.
  These are all layouts that form the top-level layout in a layout tree.
  Optionally retrieve only those at a given location by supplying locationId.
  """
  layoutsRoots(locationId: ID!): LayoutsPayload!

  """ Get a layout details by ID """
  layoutsLayouts(ids: [ID!]): LayoutsPayload!

  """
  Get a list of unit graph "root" units: the top-level units of the unit graphs, here those with a position of their
  own at these locations, at any time; with below, at them and at every location under them that you can read. None
  at a location you cannot read, and none under it unless it is a location tree's root.
  """
  unitsRoots(locationIds: [ID!], below: Boolean): UnitsPayload!

  """
  The arrivals at these locations: units, not unit graph roots, that came there together from elsewhere in their unit
  graphs (UnitArrival); newest first, undated last. With below, at them and at every location under them that you can
  read: an arrival is still at the location it came to (samples brought from a field to its farm's lab arrived at the
  lab). With unitId, only the units at, below or above it, e.g. where the samples of a tree went. None at a location
  you cannot read, and none under it unless it is a location tree's root.
  """
  unitsArrivals(locationIds: [ID!]!, unitId: ID, below: Boolean): UnitArrivalsPayload!

  """ A page of an arrival's units, by name: limit at most 1000 (default 100) 
  """
  unitsArrivalUnits(arrival: ArrivalInput!, offset: Int, limit: Int): UnitsPayload!

  """ Get units by ID. """
  unitsUnits(ids: [ID!]): UnitsPayload!

  """
  Every readable unit below the given units, grouped by subject, as id and name.
  For selecting all the units of a subject at once, e.g. every tree of a field.
  """
  unitsDescendantsBySubject(unitIds: [ID!]!): SubjectUnitsPayload!

  """ Get a list of all programs """
  programs: ProgramsPayload!

  """Get a program by Id of program, trial or study """
  programsProgram(id: ID, trialId: ID, studyId: ID): ProgramPayload!

  """ Get trials by Id of trial or study """
  programsTrial(id: ID, studyId: ID): TrialPayload!

  """ Get study by study Id """
  programsStudy(id: ID!): StudyPayload!

  """ Filter datasets by study and/or concept Id, OR retrieve by array of dataset ids 
  """
  datasets(ids: [ID!], studyIds: [ID!], conceptIds: [ID!]): DatasetsPayload!

  """ Get dataset submission by key """
  datasetsSubmission(id: ID!): DatasetSubmissionPayload!

  """ Get a summary of datasets for a study """
  datasetsSummaries(studyId: ID!): DatasetSummariesPayload!

  """
  One level of the tree of units the given datasets have records for: the children of parentIds, or, without
  parentIds, the roots. The tree holds the recorded units, those the user cannot read as placeholders, and the
  readable units above them; each hangs from its nearest readable ancestor, and a hidden unit holds nothing below it.
  start and end narrow the records counted to those whose own period overlaps the window, as for Dataset.records.
  Datasets the user cannot read contribute nothing. For offering only the units that matter to the datasets when
  narrowing their records.
  """
  datasetsUnits(datasetIds: [ID!]!, parentIds: [ID!], start: DateTime, end: DateTime): DatasetsUnitsPayload!

  """
  Every unit the given datasets have records for, grouped by subject as id and name, narrowed like
  Dataset.records: unitIds to those units and everything below the readable ones, start and end to a time window.
  Units the user cannot read are placeholders in one group without a subject.
  For selecting all the recorded units of a subject at once, e.g. every measured tree of a field.
  """
  datasetsUnitsBySubject(datasetIds: [ID!]!, unitIds: [ID!], start: DateTime, end: DateTime): SubjectUnitsPayload!

  """
  Where analysis position grouping (PositionGroupingInput) could place the records of readable datasets: the
  locations of the location types at or above the positions of their recorded units and of the units above them,
  with the layouts of those positions and the axis names they give. For the analysis editor: which unit places a
  record, and when, are left to the analysis, so these are every place it could use. Only what the user can read
  is given.
  """
  datasetsPlaces(datasetIds: [ID!]!, locationTypeIds: [ID!]!): DatasetPlacesPayload!

  """ Get the controller data for access controlled entities """
  controlsControllers(entityLabel: ControlledModelLabel!, entityIds: [ID!]!): ControllersPayload!

  """
  How to credit each entity, for anyone, signed in or not: the attributions of the teams that control it, which they
  make public by setting them (Team.attribution). An entity you cannot read, or an id of no entity, has none.
  """
  controlsAttributions(entityLabel: ControlledModelLabel!, entityIds: [ID!]!): AttributionsPayload!

  """
  How many entities of each label teams control, by release. Only for teams the user is an admin of: a request
  naming any other team is refused.
  """
  controlsControlledCounts(teamIds: [ID!]!): ControlledCountsPayload!

  """
  The entities of a label a team controls, at a release if given, ordered by id, a page at a time (limit defaults
  to 50). Only for a team the user is an admin of.
  """
  controlsControlledEntities(teamId: ID!, label: ControlledModelLabel!, release: ReadRelease, offset: Int, limit: Int): ControlledItemsPayload!

  """
  The units a team controls, as a tree: without parentIds the roots of the unit graphs holding them, with parentIds
  the nearest units below each that the team controls or that hold units it controls. Only for a team the user is
  an admin of.
  """
  controlsControlledUnits(teamId: ID!, parentIds: [ID!]): ControlledUnitsPayload!

  """ Control transfers offered to or from teams the user is an admin of """
  controlsTransfers(statuses: [ControlTransferStatus!]): ControlTransfersPayload!

  """ Get a control transfer offered to or from a team the user is an admin of 
  """
  controlsTransfer(id: ID!): ControlTransferPayload!

  """Get a list of Germplasm entries"""
  germplasmEntries(ids: [ID!]): GermplasmEntriesPayload!

  """
  The Germplasm entries you can read with one of the names, or a synonym, ignoring case and surrounding space: up to
  1000 names, e.g. to match the names typed or pasted into a table. Names are unique among germplasm, synonyms need
  not be.
  """
  germplasmEntriesNamed(names: [String!]!): GermplasmEntriesPayload!

  """
  Get a list of Germplasm entries that have no sources defined,
  these should typically represent the Crop concept
  """
  germplasmCrops: GermplasmEntriesPayload!

  """ Get reference by reference ID """
  references(ids: [ID!]): ReferencesPayload!

  """ Get a users recently created/updated file references """
  referencesRecentFiles(referenceTypes: [ReferenceType!]): ReferencesPayload!

  """
  The standard licences every deployment starts with, CC BY 4.0 then CC0 1.0: legal references without controls,
  which everyone reads and no one changes, for licence pickers to offer first
  """
  referencesStandardLicences: ReferencesPayload!

  """ Search for references by text in description. Also searches for filename, url and externalId where relevant. 
  """
  referencesSearch(description: String!, referenceTypes: [ReferenceType!]): ReferencesPayload!

  """ Get file submission by fileId for progress and status updates """
  referencesFileSubmission(fileId: ID!): FileSubmissionPayload!

  """ Check the availability of a file for download"""
  referencesFileDownloadState(fileId: ID!): FileDownloadStatePayload!

  """ Get a token to download a file """
  referencesFileDownload(fileId: ID!): FileDownloadPayload!

  """ Get analysis status and results """
  analysisSubmission(id: ID!): AnalysisSubmissionPayload!

  """ Get the IDs of the user's analysis submissions that have not expired, most recently updated first 
  """
  analysisRecentSubmissions: AnalysisSubmissionIdsPayload!

  """ The Terms of Use, and whether the request's user has accepted them: open before they are accepted 
  """
  termsOfUse: TermsOfUsePayload!

  """ The privacy notice: open to everyone, before the Terms of Use are accepted too 
  """
  privacyNotice: PrivacyNoticePayload!
}

interface ReferenceInterface {
  id: ID!
  description: String
}

enum ReferenceType {
  LEGAL
  EXTERNAL
  FILE
  EXTERNAL_DATA
  DATA_FILE
}

""" How a legal reference's text is written """
enum TextFormat {
  """ Shown as it is written """
  PLAIN

  """ Rendered as markdown """
  MARKDOWN
}

"""
Legal text, such as a study's licence: typed, or read from a .txt, .md or .pdf file, which is kept for download
"""
type LegalReference implements ReferenceInterface {
  id: ID!
  description: String
  text: String
  textFormat: TextFormat!

  """
  The SHA-256 of the file the text was read from, or of the typed text: what accepting the reference names. It
  changes with the text. Null on a placeholder
  """
  contentHash: String

  """ Read from a file: its name and type, and its id for referencesFileDownload once it is saved 
  """
  filename: String
  contentType: String
  fileId: ID

  """
  Whether the request carries an acceptance of this reference's current text, as a study's licence (licencesAccept),
  for its user or a visitor who isn't signed in
  """
  accepted: Boolean!
}

type ExternalReference implements ReferenceInterface {
  id: ID!
  description: String
  url: String
  externalId: String
}

type FileReference implements ReferenceInterface {
  id: ID!
  description: String
  filename: String
  fileId: ID
  contentType: String

  """ The Persons credited, with the roles they had """
  contributions: [Contribution]
}

type ExternalDataReference implements ReferenceInterface {
  id: ID!
  description: String
  url: String
  externalId: String
  format: DataFormat
  schema: String

  """ The Persons credited, with the roles they had """
  contributions: [Contribution]
}

type DataFileReference implements ReferenceInterface {
  id: ID!
  description: String
  filename: String
  fileId: ID
  contentType: String
  format: DataFormat
  schema: String

  """ The Persons credited, with the roles they had """
  contributions: [Contribution]
}

type FileSubmission {
  referenceId: ID
  status: SubmissionStatus
  progress: Int
  errors: [String]
}

enum FileStatus {
  ARCHIVED
  RETRIEVING
  AVAILABLE
  FAILED
}

type FileRetrieval {
  startedAt: DateTime
  progress: Int
}

type FileDownloadState {
  status: FileStatus!
  progress: FileRetrieval

  """
  The study licences to accept before the file can be downloaded (licencesAccept): those of the datasets citing it,
  directly or through their records, whether you can see them or not. Empty when there are none, when they are
  accepted, or when you read the file, or a dataset citing it or its study, through a controlling team.
  """
  licences: [LegalReference!]!
}

type FileDownload {
  expiresAt: DateTime!
  url: String!
}

union ReferenceUnion = LegalReference | ExternalReference | ExternalDataReference | DataFileReference | FileReference

enum Access {
  READ
  WRITE
  ADMIN
  CURATE
}

enum Authorisation {
  REQUESTED
  AUTHORISED
  REVOKED
}

type Affiliation {
  user: UserDisplay!
  authorisation: Authorisation!
  heritable: Boolean!

  """ The user asked for an affiliation they hold to the team only to be made heritable, and the admins have yet to decide 
  """
  heritableRequested: Boolean!
}

type Affiliations {
  read: [Affiliation!]
  write: [Affiliation!]
  admin: [Affiliation!]
  curate: [Affiliation!]
}

"""
A reference to a team, as the viewer may see it: the team itself, or, when the team referred to is hidden from them,
the nearest team they can see that includes it, at furthest its team tree's root (standIn). A stand-in says whom
to ask for an affiliation to see more. It is a property of the reference, not of the team, so it is not on Team,
which the client caches by id: the same team can be referred to as itself in one place and as a stand-in in another.
"""
type TeamReference {
  team: Team!
  standIn: Boolean!
}

type Team {
  id: ID!
  name: String!
  fullname: String

  """
  The team's own text to credit it by. It is public: controlsAttributions gives it to anyone, with what the team
  controls (docs/read-access.md, rule 9). Teams below it use it unless they set their own.
  """
  attribution: String

  """ The nearest attribution above the team in its tree, which credits the team when it has none of its own 
  """
  inheritedAttribution: String
  parent: Team
  children: [Team!]
  affiliations: Affiliations
  directAffiliations: Affiliations
  inheritedAffiliations: Affiliations
}

type UserAccess {
  read: [Team!]
  write: [Team!]
  admin: [Team!]
  curate: [Team!]
}

""" The Terms of Use, which everyone accepts before using BreedGraph, through the website or the API (docs/licences.md §4) 
"""
type TermsOfUse {
  """ The published text, in markdown """
  text: String!

  """ Its SHA-256, which termsAccept names: it changes with the text, and everyone is then asked again 
  """
  contentHash: String!

  """ Whether the request carries an acceptance of this text, for its user or for a visitor who isn't signed in 
  """
  accepted: Boolean!
}

type TermsOfUsePayload {
  status: QueryStatus!
  result: TermsOfUse
  errors: [Error!]
}

""" How BreedGraph uses personal data, for anyone to read, before accepting the Terms of Use too 
"""
type PrivacyNotice {
  """ The published text, in markdown """
  text: String!

  """ Its SHA-256, which an account records with the consent given when registering 
  """
  contentHash: String!
}

type PrivacyNoticePayload {
  status: QueryStatus!
  result: PrivacyNotice
  errors: [Error!]
}

type Position {
  """ID of Location in a LocationTree"""
  location: Location!

  """ID of Layout in and LayoutTree"""
  layout: Layout

  """
  Coordinates should be a list of values corresponding to the stored layout axes.
  """
  coordinates: [String]
  start: DateTime
  end: DateTime
}

type Unit {
  id: ID!
  subject: Subject
  germplasm: GermplasmEntry
  name: String
  description: String
  positions: [Position]
  parents: [Unit]
  children: [Unit]

  """
  The units above it, closest first: those you can read, found through hidden ones as parents are, and its unit
  graph's root, a placeholder when hidden. None for a unit you cannot read. Read for every unit of the request at once.
  """
  ancestors: [Unit!]!

  """
  Without germplasm of its own, the germplasm of the nearest units above it with some, as analysis takes it: one on
  each lineage (a path up stops at the first unit with germplasm), which must agree. Null with its own, with none
  above, when they differ (e.g. a sample pooled from trees of two varieties), or when one is hidden from you.
  Read for every unit of the request at once.
  """
  inheritedGermplasm: InheritedGermplasm

  """
  The units its material came from, e.g. the microcuttings plantlets grew from: unlike parents, they pass nothing
  down (germplasm, place, factors), so the unit starts a context of its own. Placeholders where hidden.
  Empty for a unit you cannot read.
  """
  derivedFrom: [UnitDerivation!]!

  """
  The units derived from it that you can read. Read for every unit of the request that asks, at once.
  """
  derivatives: [UnitDerivation!]!
}

""" A unit's material came from another: the unit at the other end of the link, and the stage it was at 
"""
type UnitDerivation {
  """ The unit it came from in derivedFrom, the unit derived from it in derivatives 
  """
  unit: Unit!
  stage: DerivationStage!

  """ e.g. the approximate stage of a plant, or how a graft was formed """
  description: String
}

"""
The form material was in when it became a unit derived from another: a physical stage, not a genetic relationship,
which germplasm entries describe. A graft is derived from several units, each at its own stage, e.g. a scion as a
CUTTING and its rootstock as a SEEDLING; how they were joined goes in the description.
"""
enum DerivationStage {
  UNKNOWN

  """ Seed, or a seed lot """
  SEED

  """ A young plant grown from seed """
  SEEDLING

  """ An unrooted vegetative piece: a stem or nodal cutting, budwood, a scion, a bud chip 
  """
  CUTTING

  """ A rooted vegetative piece """
  ROOTED_CUTTING

  """ An established whole plant: give its approximate stage in the description 
  """
  PLANT

  """
  Material in culture: an explant, callus, somatic embryos, embryo rescue, anther or microspore culture, a
  micro-graft, a cryopreserved shoot tip
  """
  IN_VITRO

  """ In vitro material acclimatised ex vitro """
  PLANTLET
}

""" Germplasm a unit takes from the units above it """
type InheritedGermplasm {
  germplasm: GermplasmEntry!

  """ The nearest unit above with this germplasm """
  unit: Unit!
}

""" Units below some units that share a subject, as id and name """
type SubjectUnits {
  subject: Subject
  units: [Unit!]!
}

"""
Units that came to a location together from elsewhere in their unit graphs, e.g. samples sent to a lab: the readable
units, not unit graph roots, with a position at the location from the same start, as entered, whose parents were not
there then. A unit is where its own position at a time puts it, else where its parent is. Positions have no identity,
so an arrival is known by its location and start: read its units with unitsArrivalUnits.
"""
type UnitArrival {
  location: Location!

  """ The start of their positions there, as entered; null for units there without one 
  """
  start: DateTime
  unitCount: Int!

  """ Its units with units derived from them that you can read, e.g. microcuttings planted as plantlets 
  """
  derivedUnitCount: Int!

  """
  Its units still there, with nothing derived from them: none when the arrival is settled, its units derived from,
  moved on or used up
  """
  pendingUnitCount: Int!

  """ The roots of the unit graphs they came from, placeholders where hidden 
  """
  roots: [Unit!]!

  """ Its units by subject, as id and name, e.g. for selecting them all at once 
  """
  unitsBySubject: [SubjectUnits!]!
}

scalar DateTime

scalar Upload