"""
Ontology nodes and relationships are created in draft phase.
When a commit is submitted, drafts become active,
and deprecated become removed.
"""
enum LifecyclePhase {
  DRAFT
  ACTIVE
  DEPRECATED
  REMOVED
}

"""
Ontology nodes form a graph with ontology relationships as edges.
Each collection of nodes with a common label forms a directed acyclic sub-graph
Each entry has an OntologyNodeLabel to distinguish various classes of entry.
"""
enum OntologyNodeLabel {
  """
  Term entries may be used to relate other key terms in the ontology.
  Example: "Metabolism" may be a term.
  """
  TERM

  """
  Subject entries describe Units (see Unit graphs) being observed in a study.
  These are linked to Unit and Trait.
  Examples: "Leaf", "Tree", "Field", "Rhizosphere"
  """
  SUBJECT

  """
  Scale entries describe units or classes used for values in a Dataset.
  These are linked to Variable or Factor .
  Scale entries require a ScaleType.
  Nominal and Ordinal scales have categories, in order: an ordinal scale's order is the rank of its categories.
  Examples:
  "Centimeters", "Counts per million", "Micro-Einsteins" are all ScaleType numerical.
  """
  SCALE

  """
  Observation method entries describe the way a value is determined.
  These are linked to Variable.
  Observation method entries require an ObservationMethodType.
  Examples: "Distance measurement with calibrated reference", "Short-read sequencing", "Rain Gauge".
  """
  OBSERVATION_METHOD

  """
  Trait entries describe observed properties of a subject (phenotype for a plant subject)
  These are linked to Variable and Subject.
  Examples:
  "Height", "Gene expression" linked to a tree subject.
  """
  TRAIT

  """
  Variable entries link a Trait, ObservationMethod and Scale
  to form a single reference term for a Dataset (see Datasets).
  Examples:
  "Tree height" where:
      Trait = "Height",
      Method = "Distance measurement with calibrated reference",
      Scale = "Centimeters".
  "Normalised Expression" where:
      Trait = "Gene expression",
      Method = "Short read sequencing",
      Scale = "Counts per million"
  """
  VARIABLE

  """
  Control method entries describe the way a value is maintained for an experiment.
  These are linked to Factor.
  Examples: "Fluorescent Lighting", "Fertilizer application"
  """
  CONTROL_METHOD

  """
  Condition entries describe the quantities/qualities that are fixed/controlled throughout an experiment.
  These are linked to Factor entries.
  Examples: "Light level", "Controlled Grafting", "Water availability"
  """
  CONDITION

  """
  Factor entries link a Condition, ControlMethod and Scale
  to form a single entry for a Dataset (see Datasets).
  Examples:
  "Controlled lighting" where:
      Condition = "Light level", ControlMethod = "Fluorescent lighting", Scale = "Micro Einsteins"
  OR
  "Controlled water availability" where:
      Condition = "Water availability", ControlMethod = "Controlled water application", Scale = "L/m2/day"
  OR
  "Grafted Material" where:
      Condition = "Genetic material", ControlMethod = "Controlled Grafting", Scale = "Plant Genetic Material"
  """
  FACTOR

  """
  Event entries link multiple Variables and Factors
  Examples:
  "Harvest" event with "Harvest method" factor, and "Yield" variable.
  """
  EVENT

  """
  LocationType entries describe types of locations.
  These are linked to Location (see Location trees).
  Examples: "Country", "State", "Field"
  """
  LOCATION_TYPE

  """
  LayoutType entries describe types of layout trees.
  These are linked to Layout (see Layout trees).
  Examples: "Grid", "Rows"
  """
  LAYOUT_TYPE

  """
  Design entries describe statistical designs for a study.
  These are linked to Study (see Programs).
  Examples: "Split-plot", "Randomized block"
  """
  DESIGN

  """
  Role entries describe the role a Person had in a contribution.
  Based on CRediT (Contributor Roles Taxonomy), extended where needed.
  Examples: "Investigation", "Data curation"
  """
  ROLE

  """
  A record group is a set of records associated by a common criterion arising from
  the execution, observation, processing, or organization of a study.
  These entries describe reusable types of record groups.
  Examples include "Biological Replicate", "Technical Replicate", "Batch", and "Plate".
  
  Note: Record groups are intended for grouping records according to study-specific or
  process-specific contexts, such as replication or laboratory processing.
  Long-term shared entities and their relationships should instead be represented as
  Units within Unit graphs. Likewise, factors in a study should be represented as records
  in a dataset rather than as record groups.
  """
  RECORD_GROUP_TYPE
}

enum OntologyRelationshipLabel {
  """Any => SAME_TYPE"""
  PARENT_OF

  """Any => Term"""
  HAS_TERM

  """Trait/Condition -> Subject"""
  DESCRIBES_SUBJECT

  """Variable -> Trait"""
  DESCRIBES_TRAIT

  """Factor -> Condition"""
  DESCRIBES_CONDITION

  """Variable -> ObservationMethod"""
  USES_OBSERVATION_METHOD

  """Factor -> ControlMethod"""
  USES_CONTROL_METHOD

  """Variable/Factor -> Scale"""
  USES_SCALE

  """Event -> Factor"""
  DESCRIBES_FACTOR

  """EventType -> Variable"""
  DESCRIBES_VARIABLE
}

enum AxisType {
  """
  String values with no implied directional relationship
  e.g. Growth Facility
  """
  NOMINAL

  """
  String values values that convey a sequence.
  e.g. Row number
  """
  ORDINAL

  """
  Numeric values that convey position within Euclidean space.
  This may be a curvilinear/affine space with unknown transformations.
  e.g. Distance from start of row when rows follow the surface topology.
  """
  COORDINATE

  """
  Cartesian coordinates are a subset of the AxisType.COORDINATE that additionally allow distance calculations.
  AxisType.CARTESIAN should be preferred when the coordinate space is approximately Cartesian,
  i.e. all axes noted as AxisType.CARTESIAN for a given layout must:
   - be pair-wise perpendicular,
   - have a common origin,
   - and common unit of length.
  e.g. Distance from start of row when rows lines are straight and perpendicular to the row axis.
  """
  CARTESIAN
}

"""
How analysis groups records with the same code across units, set on each record grouping of a study.
A code can mean the same on every unit (e.g. a canopy stratum "Lower"); the extent decides whether analysis uses that.
"""
enum RecordGroupExtent {
  """
  Records of different units with the same code are one group, a level that can be estimated across units,
  e.g. a unit graph, batch, session or canopy stratum.
  """
  SHARED

  """
  Codes are nested in each record's unit: records of one unit with the same code at one time, or within the
  replicate aggregation window, are one reading, e.g. replicate readings, subsamples or the branches of a tree.
  A term's replicateAggregation combines them.
  """
  WITHIN_UNIT

  """
  Codes are nested in the root of each record unit's graph: records of units of one graph with the same
  code are one group, a level that can be estimated across those units, e.g. the design blocks of a field,
  whose names recur in other fields. Otherwise as SHARED.
  """
  WITHIN_GRAPH
}

enum ObservationMethodType {
  MEASUREMENT
  COUNTING
  ESTIMATION
  COMPUTATION
  PREDICTION
  DESCRIPTION
  CLASSIFICATION
}

enum ControlMethodType {
  """ Environmental controls, e.g. light, temperature, humidity. """
  ENVIRONMENTAL

  """ Nutritional controls, e.g. fertilizer application. """
  NUTRITIONAL

  """ Chemical controls (non-nutritive) .e.g. herbicides, hormones etc. """
  CHEMICAL

  """ Biological controls, e.g. microbial treatment, fungal inoculation, insect colonization
  """
  BIOLOGICAL

  """ Management controls, e.g. cropping density, pruning """
  MANAGEMENT

  """ Genetic controls, e.g. controlled crossing """
  GENETIC
}

enum ScaleType {
  DATE
  DURATION
  NUMERICAL
  NOMINAL
  ORDINAL
  TEXT
  COMPLEX
}

"""Controls how the ontology is materialized for a given version."""
enum OntologyView {
  """
  The ontology as seen by editors working on the latest version.
  
  Includes draft changes that are part of the given version.
  """
  EDITORIAL

  """
  The ontology as published for entity creation.
  
  Includes only approved content in the given version.
  """
  PUBLISHED

  """
  Ontology entries resolved for existing entity references.
  
  Includes referenced ontology entries even if they have been removed,
  allowing existing references to remain resolvable.
  Relationship attributes are resolved as for published.
  """
  REFERENTIAL
}

interface OntologyNodeInterface {
  """Entries are keyed by id, versionId and the view context for caching"""
  id: ID!
  versionId: ID!
  view: OntologyView!

  """The current lifecycle phase"""
  phase: LifecyclePhase!

  """Intrinsic attributes"""
  name: String!
  description: String
  abbreviation: String
  synonyms: [String!]

  """ For an entry taken from an external standard or ontology: its URL, and how to attribute it 
  """
  sourceUrl: String
  sourceAttribution: String

  """ A locked entry keeps its name, abbreviation, description, source and defining relationships, and cannot be deprecated 
  """
  locked: Boolean!

  """
  External relationships attributes are also handled with versioned change tracking like intrinsic attributes.
  """
  references: [ReferenceInterface!]
}

"""
All nodes also have projected attributes that are dependent on their relationships
Parents and children describe connected nodes with the same label,
with inbound edges being parents, and outbound edges being children.
"""
interface OntologyRelationships {
  parents: [OntologyNodeInterface!]
  children: [OntologyNodeInterface!]
}

