"""Where a country's or a section's detailed maps stand"""
enum MapState {
  """Never asked for, or asked for where this site fetches no detailed maps"""
  NONE

  """Asked for: being outlined and measured before they are fetched"""
  PENDING

  """Being fetched"""
  FETCHING
  READY

  """
  A country too large to fetch whole, whose sections are fetched as locations in them are placed on the map
  """
  DIVIDED
  FAILED
}

"""
A section of a country too large to fetch whole, such as a state or province
"""
type MapSectionStatus {
  name: String!
  state: MapState!

  """The size of its detailed maps in bytes, once measured"""
  size: Float

  """Why they could not be fetched"""
  error: String
}

"""The detailed maps of a country on this site"""
type CountryMapStatus {
  code: String!
  state: MapState!

  """The size of its detailed maps in bytes, once measured"""
  size: Float

  """
  In bytes: the size above which a country is fetched by its sections, and a section is not fetched
  """
  limit: Float!

  """Whether this site fetches detailed maps"""
  enabled: Boolean!

  """Why they could not be fetched"""
  error: String

  """
  For a divided country, the sections fetched, being fetched or that failed
  """
  sections: [MapSectionStatus!]!

  """Its places for the place search"""
  places: PlacesStatus!
}

"""
Where a country's own places for the place search stand: NONE, PENDING, READY or FAILED
"""
type PlacesStatus {
  state: MapState!

  """Whether this site fetches places"""
  enabled: Boolean!

  """
  Whether the world's towns of 1,000 people or more are searched, which stand in for a country's own places
  """
  towns: Boolean!

  """Why they could not be fetched"""
  error: String
}

"""
A place found by name, to move the location map to, from GeoNames (geonames.org, CC BY 4.0)
"""
type Place {
  name: String!
  latitude: Float!
  longitude: Float!

  """
  [[south, west], [north, east]], for a country: around its main parts, east above 180 across the antimeridian
  """
  bounds: [[Float!]!]

  """What kind of place it is: "town", "farm", "mountain"…"""
  description: String

  """The sections of its country it is in: "Kerry, Munster" """
  region: String

  """Its country's name; null for a country"""
  country: String

  """
  Its country's ISO 3166 alpha-3 code, as the country is coded in the location trees; a country's own
  """
  countryCode: String

  """The map's zoom to show it at, when it has no bounds"""
  zoom: Int
}

