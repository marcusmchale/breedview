"""How the viewer sees a Person. See docs/person.md §3"""
enum PersonView {
  """
  The record: for read affiliates of a team controlling it, and for the linked user
  """
  FULL

  """
  What attribution needs (name, institution, ORCID iD): for those who can read it only because it is released to them
  """
  ATTRIBUTION

  """
  The id only: for anyone else, where the Person is referred to or asked for by id
  """
  RESTRICTED
}

"""
Someone who took part in research, for attribution. See docs/person.md.
What the viewer sees depends on view: the record in FULL; name, institution and ORCID iD as ATTRIBUTION; the id only
when RESTRICTED. Fields outside the view are null (lists empty). Persons are released at most to registered users,
and anonymous users get no contacts or contributors, so they see no Persons. Searches leave restricted Persons out
(docs/read-access.md). An erased Person keeps its id only, so contributions stay
attributed to an anonymous person; it shows as erased only to those who could see it before.
"""
type Person {
  id: ID!
  view: PersonView!

  """Display name used for attribution. Null when restricted or erased"""
  name: String

  """
  The institution the person did the work with, for attribution. Null when restricted or erased
  """
  institution: String

  """
  Affiliation, in the full view: the teams the person worked in, which grant no access (the linked user's
  affiliations do). Those hidden from the viewer are stood in for by the nearest team they can see
  """
  teams: [TeamReference!]!

  """
  In the full view: the creator confirmed the person consented to this record
  """
  consentAttestation: Boolean

  """
  Set by the linked user, verified through ORCID sign-in. Null when restricted or erased
  """
  orcid: String

  """
  In the full view: whether a user is linked to this Person, whether or not the viewer may see who
  """
  linked: Boolean

  """
  The user linked to this Person, who has rights over the record: shown to that user and admins of their teams
  """
  linkedUser: UserDisplay

  """In the full view, shown to the user and admins of their teams"""
  recordedBy: UserDisplay

  """In the full view"""
  recordedAt: DateTime

  """Whether the Person was erased: false when restricted"""
  erased: Boolean!

  """In the full view"""
  erasedAt: DateTime

  """True when the view is RESTRICTED"""
  restricted: Boolean!
}

