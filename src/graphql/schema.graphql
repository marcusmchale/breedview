  These IDs can be supplied as exclusions to a subsequent analysis.
  """
  recordIds: [ID!]
}

"""Estimated marginal means requested for an analysis."""
type EstimatedMeansConfig {
  terms: [AnalysisTermReference!]!
  by: [AnalysisTermReference!]!
  contrast: EstimatedMeansContrast!
  control: String
  adjustment: PValueAdjustment!
}

"""Estimated marginal means (least-squares means) and their contrasts."""
type EstimatedMeansResult {
  """Response term of the model."""
  response: AnalysisTermReference

  """Model terms for which means were estimated."""
  terms: [AnalysisTermReference!]!

  """Model terms conditioning the estimates."""
  by: [AnalysisTermReference!]!

  """Contrasts calculated between the means."""
  contrast: EstimatedMeansContrast!

  """Adjustment applied to p values."""
  adjustment: PValueAdjustment!

  """Estimated means."""
  means: [LSMeanResult!]!

  """Contrasts between the estimated means."""
  contrasts: [EstimatedMeansContrastResult!]!
}

"""The level of a term."""
type AnalysisTermLevel {
  term: AnalysisTermReference!

  """Level of the term, as represented in the analysis."""
  level: String!
}

"""An estimated marginal mean."""
type LSMeanResult {
  """Levels of the terms for which the mean was estimated."""
  levels: [AnalysisTermLevel!]!

  """Levels of the conditioning terms."""
  by: [AnalysisTermLevel!]!

  """Estimated mean."""
  mean: Float
  standardError: Float
  degreesOfFreedom: Float
  lowerConfidenceLimit: Float
  upperConfidenceLimit: Float
}

"""A contrast between estimated marginal means."""
type EstimatedMeansContrastResult {
  """Label of the contrast, e.g. "A - B"."""
  label: String!

  """Levels of the first mean in the contrast."""
  levelsA: [AnalysisTermLevel!]!

  """Levels of the second mean in the contrast."""
  levelsB: [AnalysisTermLevel!]!

  """Levels of the conditioning terms."""
  by: [AnalysisTermLevel!]!

  """Estimated difference."""
  estimate: Float
  standardError: Float
  degreesOfFreedom: Float

  """Test statistic (t or z ratio)."""
  statistic: Float

  """Adjusted p value."""
  pValue: Float
  lowerConfidenceLimit: Float
  upperConfidenceLimit: Float

  """Whether the contrast is significant at the analysis alpha."""
  significant: Boolean
}

"""
A rule for excluding records from an analysis.

Mirrors AnalysisExclusionInput, so it can be supplied as an
exclusion to a subsequent analysis.
"""
type AnalysisExclusion {
  recordIds: [ID!]
  unitIds: [ID!]
  germplasmIds: [ID!]
  studyIds: [ID!]
  positions: [PositionExclusion!]
  recordGroups: [AnalysisRecordGroupMember!]

  """Inclusive start of the rule. Null means unbounded."""
  start: DateTime

  """Exclusive end of the rule. Null means unbounded."""
  end: DateTime
}

"""A position criterion of an exclusion rule."""
type PositionExclusion {
  locationId: ID!
  layoutId: ID
  axes: [AxisValue!]
}

"""The value of a layout axis."""
type AxisValue {
  index: Int!
  value: String!
}

"""
Grouping configuration used to construct analytical observations.

Grouping defines the statistical unit represented by each observation.
"""
type AnalysisGrouping {
  """Time grouping used to construct analytical observations."""
  time: TimeGrouping

  """Germplasm grouping used to construct analytical observations."""
  germplasm: GermplasmGrouping

  """
  The observation unit: each record's base unit rolled up into its
  nearest unit of one of the subjects.
  """
  unit: UnitGrouping

  """Position grouping used to construct analytical observations."""
  position: PositionGrouping

  """Record group dimensions used to construct analytical observations."""
  recordGroups: [AnalysisRecordGroupDimension!]!
}

type TimeGrouping {
  """Binning configuration applied to record start/end times."""
  binning: Binning!

  """Determines how records are assigned to time bins."""
  assignment: TimeAssignment!
}

type GermplasmGrouping {
  """
  Germplasm IDs defining the grouping levels.
  
  Germplasm hierarchy is traversed to assign each unit to
  the appropriate grouping level, from the unit's own germplasm
  or the one it inherits (Unit.inheritedGermplasm). Empty: each
  unit's germplasm is a level.
  """
  germplasmIds: [ID!]!
}

type UnitGrouping {
  """The subjects whose units observations are made at, e.g. Plot."""
  subjectIds: [ID!]!
}

type PositionGrouping {
  """Location types whose nearest location places each record."""
  locationTypeIds: [ID!]!

  """Subjects whose units place the units below them."""
  subjectIds: [ID!]!

  """Names of the layout axes that are dimensions."""
  axes: [String!]!

  """Stands in for each record's time in choosing between positions."""
  time: DateTime
}

"""A record group dimension as applied by an analysis."""
type AnalysisRecordGroupDimension {
  """Name of the dimension."""
  name: String!

  """Record groupings contributing to the dimension."""
  groupings: [AnalysisRecordGrouping!]!

  """
  Subjects whose units are levels, for studies without one of the groupings.
  """
  subjectIds: [ID!]!

  """Shared levels combining codes across groupings or scopes."""
  levels: [AnalysisRecordGroupLevel!]!
}

"""A record grouping contributing to a record group dimension."""
type AnalysisRecordGrouping {
  """ID of the record grouping."""
  groupingId: ID!

  """ID of the study the grouping belongs to."""
  studyId: ID
}

"""A level shared by codes from one or more record groupings."""
type AnalysisRecordGroupLevel {
  label: String!
  members: [AnalysisRecordGroupMember!]!
}

type AnalysisRecordGroupMember {
  groupingId: ID!
  code: String!

  """
  Dataset identifying the scope of the code, for dataset-scoped groupings.
  """
  datasetId: ID
}

union AnalysisResult = AnovaResult | MDSResult | CorrelationResult | DescriptiveStatisticsResult | OutlierDetectionResult

type AnovaConfig {
  """Terms used by the analysis."""
  terms: [AnalysisTerm!]!

  """The response term."""
  response: AnalysisTermReference!

  """Dimensions used to construct analytical observations."""
  grouping: AnalysisGrouping

  """Interactions between analysis terms."""
  interactions: [InteractionTerm!]!

  """Significance level used for hypothesis testing."""
  alpha: Float!

  """Type of sums of squares."""
  sumOfSquares: SumOfSquaresType!

  """Denominator degrees of freedom method for mixed models."""
  ddf: DdfMethod!

  """Estimated marginal means and contrasts."""
  estimatedMeans: [EstimatedMeansConfig!]!
}

type AnovaResult {
  """ID of the analysis that produced the result."""
  analysisId: ID!

  """Results for individual model terms."""
  terms: [AnovaTermResult!]!

  """Results for model interactions."""
  interactions: [AnovaInteractionResult!]!

  """Variance components of random effects, for mixed models."""
  randomEffects: [VarianceComponentResult!]!

  """Estimated marginal means and contrasts when requested."""
  estimatedMeans: [EstimatedMeansResult!]!

  """Residual/error statistics for the fitted model."""
  residual: AnovaResidualResult
}

"""Variance component of a random effect."""
type VarianceComponentResult {
  """Grouping term of the random effect."""
  group: AnalysisTermReference!

  """Term of a random slope. Null for random intercepts."""
  slope: AnalysisTermReference

  """Estimated variance."""
  variance: Float

  """Estimated standard deviation."""
  standardDeviation: Float
}

type AnovaResidualResult {
  """Degrees of freedom for the residual error."""
  degreesOfFreedom: Float

  """Residual sum of squares."""
  sumOfSquares: Float

  """Residual mean square."""
  meanSquare: Float
}

type AnovaTermResult {
  """Term represented by this result."""
  term: AnalysisTermReference!

  """Degrees of freedom."""
  degreesOfFreedom: Float

  """Denominator degrees of freedom, for mixed models."""
  denominatorDegreesOfFreedom: Float

  """Sum of squares."""
  sumOfSquares: Float

  """Mean square."""
  meanSquare: Float

  """F statistic."""
  fStatistic: Float

  """P value."""
  pValue: Float
}

type AnovaInteractionResult {
  """Terms participating in the interaction."""
  terms: [AnalysisTermReference!]!

  """Degrees of freedom."""
  degreesOfFreedom: Float

  """Denominator degrees of freedom, for mixed models."""
  denominatorDegreesOfFreedom: Float

  """Sum of squares."""
  sumOfSquares: Float

  """Mean square."""
  meanSquare: Float

  """F statistic."""
  fStatistic: Float

  """P value."""
  pValue: Float
}

type CorrelationConfig {
  """Terms included in the correlation matrix."""
  terms: [AnalysisTerm!]!

  """Dimensions used to construct analytical observations."""
  grouping: AnalysisGrouping

  """Correlation method."""
  method: CorrelationMethod!
}

type CorrelationResult {
  """ID of the analysis that produced the result."""
  analysisId: ID!

  """Terms included in the correlation matrix."""
  terms: [AnalysisTermReference!]!

  """Correlation matrix."""
  matrix: [CorrelationMatrixRow!]!
}

type CorrelationMatrixRow {
  """Term represented by this row."""
  term: AnalysisTermReference!

  """
  Correlation values corresponding to the ordered term list.
  Null where too few observations have values for both terms.
  """
  values: [Float]!
}

type DescriptiveStatisticsConfig {
  """Terms for which descriptive statistics are calculated."""
  terms: [AnalysisTerm!]!

  """Dimensions used to construct analytical observations."""
  grouping: AnalysisGrouping

  """
  Interactions between terms used when calculating
  model-dependent statistics such as least-squares means.
  """
  interactions: [InteractionTerm!]!

  """Estimated marginal means requested."""
  estimatedMeans: [EstimatedMeansConfig!]!
}

type DescriptiveStatisticsResult {
  """ID of the analysis that produced the result."""
  analysisId: ID!

  """Descriptive statistics calculated for the requested terms."""
  terms: [DescriptiveTermResult!]!

  """Estimated marginal means (least-squares means) when requested."""
  estimatedMeans: [EstimatedMeansResult!]!
}

type DescriptiveTermResult {
  """Term for which statistics were calculated."""
  term: AnalysisTermReference!

  """
  Levels of the categorical and ordinal terms for which the statistics
  were calculated. Empty for statistics over all observations.
  """
  levels: [AnalysisTermLevel!]!

  """
  Analytical group represented by this result, when all levels are
  of domain terms.
  """
  group: AnalysisGroup

  """Number of observations."""
  count: Int!

  """Number of missing observations."""
  missingCount: Int!

  """
  The summary of an ORDINAL concept term, e.g. a disease score: its categories, with the minimum, quartiles, median
  and maximum as categories. Null for a CONTINUOUS term, whose statistics are the fields below, null for an ORDINAL one.
  """
  ordinal: OrdinalSummary
  mean: Float
  standardDeviation: Float
  standardError: Float
  median: Float
  minimum: Float
  maximum: Float
  lowerQuartile: Float
  upperQuartile: Float
}

"""
An ORDINAL term's observations as its ranked categories allow: no mean or standard deviation, which would take the
steps between categories as equal.
"""
type OrdinalSummary {
  """
  Each category of the term, in its order, with how many observations fell in it, those without one too.
  """
  categories: [OrdinalCategoryCount!]!

  """
  The category at each quantile: the first whose cumulative share of the observations reaches it, so always one
  observed. Null without observations.
  """
  minimum: String
  lowerQuartile: String
  median: String
  upperQuartile: String
  maximum: String
}

type OrdinalCategoryCount {
  """The category, as the term's levels name it."""
  level: String!
  count: Int!

  """
  The category's share of the observations, from 0 to 1. Null without observations.
  """
  share: Float
}

type AnalysisGroup {
  """Time grouping represented by this group."""
  time: String

  """Germplasm grouping represented by this group."""
  germplasmId: ID

  """Unit grouping represented by this group."""
  unitId: ID

  """Location represented by this group."""
  locationId: ID

  """Layout axis values represented by this group."""
  layoutAxes: [AnalysisLayoutAxisLevel!]!

  """Study represented by this group, when a STUDY term is used."""
  studyId: ID

  """Record group levels represented by this group."""
  recordGroups: [AnalysisRecordGroupAssignment!]!
}

"""The value of a layout axis represented by a group."""
type AnalysisLayoutAxisLevel {
  """Name of the axis."""
  axis: String!

  """ID of the layout that has the axis; values are nested in it."""
  layoutId: ID!
  value: String!
}

"""The level of a record group dimension represented by a group."""
type AnalysisRecordGroupAssignment {
  """Name of the dimension."""
  dimension: String!

  """
  Identifier of the level, unique within the dimension.
  
  The label of a shared level, "unit|<unitId>" for a unit level, otherwise an identifier
  composed of grouping, scope, code and, for WITHIN_UNIT groupings, the base unit,
  or for WITHIN_GRAPH groupings, the root of the base unit's graph.
  """
  level: String!

  """Whether the level is a shared level."""
  shared: Boolean!

  """Grouping of a nested level. Null for shared levels and unit levels."""
  groupingId: ID

  """
  Datasets of the scope of a nested level.
  
  Null for study-wide groupings and shared levels.
  """
  scopeDatasetIds: [ID!]

  """Code of a nested level."""
  code: String

  """
  The unit of a unit level, a unit of one of the dimension's subjects.
  Otherwise the base unit of a nested level of a WITHIN_UNIT grouping, whose codes are only comparable within a unit,
  or the root of the base unit's graph for a WITHIN_GRAPH grouping, whose codes are only comparable within a graph.
  """
  unitId: ID
}

type MDSConfig {
  """Terms used to calculate distances between analytical observations."""
  terms: [AnalysisTerm!]!

  """Dimensions used to construct analytical observations."""
  grouping: AnalysisGrouping

  """Distance metric used to calculate dissimilarity."""
  distance: DistanceMetric!

  """Number of dimensions in the MDS representation."""
  dimensions: Int!

  """Optional clustering of the analytical observations."""
  clustering: MDSClusteringConfig
}

type MDSClusteringConfig {
  """Clustering method."""
  method: ClusteringMethod!

  """Number of clusters when required by the selected method."""
  clusters: Int
}

type MDSResult {
  """ID of the analysis that produced the result."""
  analysisId: ID!

  """Analytical observations represented in MDS space."""
  observations: [MDSObservation!]!
}

type MDSObservation {
  """Group represented by the analytical observation."""
  group: AnalysisGroup!

  """Record IDs contributing to the observation."""
  recordIds: [ID!]!

  """Coordinates in MDS space."""
  coordinates: [Float!]!

  """Cluster assigned to this observation when clustering was requested."""
  clusterId: ID
}

type OutlierDetectionConfig {
  """Terms used to identify potential outliers."""
  terms: [AnalysisTerm!]!

  """Dimensions used to construct analytical observations."""
  grouping: AnalysisGrouping

  """Method used to identify potential outliers."""
  method: OutlierDetectionMethod!
}

type OutlierDetectionResult {
  """ID of the analysis that produced the result."""
  analysisId: ID!

  """Detected potential outliers."""
  outliers: [OutlierResult!]!
}

type OutlierResult {
  """Analytical observation identified as a potential outlier."""
  observation: AnalysisGroup!

  """
  A rule excluding the records of the observation, which can be
  supplied as an exclusion to a subsequent analysis.
  
  Built from the contributing base units, the time bin and
  the record group members of the observation.
  """
  exclusion: AnalysisExclusion!

  """
  Term for which the observation was identified as an outlier.
  Null for multivariate methods.
  """
  term: AnalysisTermReference

  """Value associated with the observation."""
  value: Float

  """Score or statistic used to identify the outlier."""
  score: Float
}

"""
A resolved analysis term.

A term may represent a concept or a domain dimension such as
time, germplasm, unit, position, record group or study.
"""
type AnalysisTerm {
  """Identifies the term."""
  reference: AnalysisTermReference!

  """Representation used for the term, where applicable."""
  representation: TermRepresentationType

  """Binning applied to the term."""
  binning: Binning

  """Explicit ordering of categorical or ordinal levels."""
  levelOrder: [String!]

  """Transformations applied to the term."""
  transformations: [TermTransformation!]!

  """
  Aggregation applied when multiple records contribute
  to an analytical observation.
  """
  aggregation: TermAggregation

  """
  Combines the replicates of a reading (codes of WITHIN_UNIT record groupings)
  before the term's aggregation.
  """
  replicateAggregation: ReplicateAggregation

  """Statistical effect of the term when a statistical model is used."""
  effect: TermEffect

  """Terms whose effects may vary as random slopes for this term."""
  randomSlopeTerms: [AnalysisTermReference!]
}

"""
Identifies a term used by an analysis.

Concept terms are identified by conceptId, record group terms by
their dimension. Other domain terms are identified by their type.
"""
type AnalysisTermReference {
  """Type of term."""
  type: AnalysisTermType!

  """Stable concept ID when the term represents a concept."""
  conceptId: ID

  """Record group dimension when the term represents a record group."""
  recordGroupDimension: AnalysisRecordGroupDimension

  """Name of the layout axis when the term represents a layout axis."""
  layoutAxis: String
}

type InteractionTerm {
  """Terms participating in the interaction."""
  terms: [AnalysisTermReference!]!
}

"""Combines the replicates of each reading before a term's aggregation."""
type ReplicateAggregation {
  aggregation: TermAggregation!

  """
  ISO 8601 duration a reading spans from its first record, e.g. PT5M or P1D.
  Null when the replicates of a reading have the same start and end.
  """
  window: String
}

type Token {
  accessToken: String!
  tokenType: String!
}

"""
A Person credited for a dataset, Program or Trial, with the roles they had.
The roles are Role entries, declared rather than exhaustive: a contribution may have none.
"""
type Contribution {
  person: Person
  roles: [Role!]
}

enum ReadRelease {
  PRIVATE
  REGISTERED
  PUBLIC
}

enum ControlledModelLabel {
  GERMPLASM
  UNIT
  PERSON
  STUDY
  TRIAL
  PROGRAM
  DATASET
  LAYOUT
  LOCATION
  REFERENCE
}

type Control {
  """ The controlling team, or when it is hidden from you, the team standing in for it 
  """
  team: TeamReference!
  release: ReadRelease!

  """ When the control was set: null for an entity you cannot read """
  time: DateTime
}

type WriteStamp {
  """ The account that wrote: shown to its owner and admins of its teams only 
  """
  user: UserDisplay

  """
  The writer's Person, for attribution: restricted if you cannot read it, null if the account has no Person
  """
  person: Person
  time: DateTime!
}

type Controller {
  controls: [Control!]!

  """
  The writes in the order they were made, or the last of them; none for an entity you cannot read
  """
  writes(last: Int): [WriteStamp!]!
  writeCount: Int!

  """ The controlling teams, those hidden from you stood in for by the nearest team you can see 
  """
  teams: [TeamReference!]!

  """ What your affiliations let you do with the entity through the teams that control it 
  """
  access: [Access!]!

  """ How to credit the entity: its controlling teams' attributions, as controlsAttributions gives them 
  """
  attributions: [String!]!
  release: ReadRelease!

  """
  Whether the entity has no controls: then everyone reads it and no one changes it, sets its release or transfers it,
  as for the standard licences (docs/read-access.md, rule 11). Its release is PUBLIC and its access READ alone.
  """
  fixed: Boolean!

  """ The first and latest writes: null for an entity you cannot read, whose history is hidden 
  """
  created: DateTime
  updated: DateTime
}

""" How to credit an entity: the attributions of the teams that control it, each its own or inherited 
"""
type EntityAttributions {
  entityId: ID!
  attributions: [String!]!
}

enum ControlTransferStatus {
  PENDING
  ACCEPTED
  REJECTED
  CANCELLED
}

"""
A controlled model. Transfers apply to the model itself, not to other models in its aggregate.
"""
type ControlledEntity {
  label: ControlledModelLabel!
  id: ID!

  """ Its name (a dataset's concept, a reference's file name or description); REDACTED when you cannot read it 
  """
  name: String
}

"""
An offer of control over controlled models, from teams that control them to a recipient team.
Admins of the recipient team accept, choosing the teams that take control from the recipient team
and the teams below it, and the release level.
Visible to admins of the recipient team and of the teams giving up control.
"""
type ControlTransfer {
  id: ID!
  status: ControlTransferStatus!
  entities: [ControlledEntity!]!

  """Teams giving up control"""
  fromTeams: [Team!]!

  """True for shared control: the teams giving up control keep it as well"""
  keepFromTeams: Boolean!
  recipientTeam: Team

  """Teams taking control, chosen on acceptance"""
  toTeams: [Team!]!

  """Release level of the new controls, chosen on acceptance"""
  release: ReadRelease
  offeredBy: UserDisplay
  offeredAt: DateTime
  acceptedBy: UserDisplay
  acceptedAt: DateTime
  rejectedBy: UserDisplay
  rejectedAt: DateTime
  cancelledBy: UserDisplay
  cancelledAt: DateTime
}

""" How many entities of a label a team controls at a release, for the team's admins 
"""
type ControlledCount {
  teamId: ID!
  label: ControlledModelLabel!

  """ The release the team set """
  release: ReadRelease!
  count: Int!
}

""" An entity a team controls, for the team's admins """
type ControlledItem {
  label: ControlledModelLabel!
  id: ID!

  """ Its name (a dataset's concept, a reference's file name or description); REDACTED when you cannot read it 
  """
  name: String

  """ The release the team set """
  release: ReadRelease!

  """ The other teams controlling it, those hidden from you stood in for by the nearest team you can see 
  """
  otherTeams: [TeamReference!]!

  """
  The name of what holds it, REDACTED when you cannot read that: a dataset's study, a study's trial, a trial's
  program, a location's parent, a layout's location; null for other labels
  """
  context: String
}

""" A page of the entities of a label a team controls, ordered by id, with how many there are in all 
"""
type ControlledItems {
  total: Int!
  items: [ControlledItem!]!
}

"""
A unit in the tree of the units a team controls, for the team's admins: one the team controls, or that holds units
it controls. The tree is the unit graphs as you may see them: hidden units are skipped, unless the team controls
them, and a hidden root is a placeholder (docs/read-access.md).
"""
type ControlledUnit {
  """ The unit's id, name, subject and germplasm only: its place in this tree is given here, not by its parents 
  """
  unit: Unit!

  """ The unit it was asked for below; null for the root of a unit graph """
  parentId: ID

  """ The release the team set; null when the team doesn't control this unit itself, only units below it 
  """
  release: ReadRelease

  """ How many units the team controls: this one, if it does, and those below it 
  """
  count: Int!

  """ The other teams controlling it, those hidden from you stood in for by the nearest team you can see 
  """
  otherTeams: [TeamReference!]!
}

type RecordGroup {
  id: ID!
  code: String!
}

type Record {
  id: ID!
  unit: Unit
  value: String
  start: DateTime
  end: DateTime
  groups: [RecordGroup!]
  references: [ReferenceInterface]
  submitted: DateTime
}

""" The codes of one record grouping that a dataset's records carry """
type GroupingCodes {
  groupingId: ID!
  codes: [String!]!
}

"""
What a dataset's records span, read without the records themselves, so that pickers and binning suggestions
need not load them
"""
type DatasetDimensions {
  recordCount: Int!
  unitCount: Int!

  """ The earliest and latest record time, either of start and end standing in for a missing other 
  """
  start: DateTime
  end: DateTime

  """ The record times, every start and end, at percentiles 0 to 100; empty when no record has a time 
  """
  timePercentiles: [DateTime!]!

  """
  The record values at percentiles 0 to 100, in numeric order when every value is a number and in text order
  otherwise; empty when no record has a value
  """
  valuePercentiles: [String!]!

  """ The record group codes present, by grouping, each in text order """
  groups: [GroupingCodes!]!
}

"""
A location that analysis position grouping could place the records of datasets at (Query.datasetsPlaces)
"""
type DatasetPlace {
  location: Location!

  """ The datasets' recorded units placed there, through their own positions or those of the units above them 
  """
  unitCount: Int!

  """ The layouts of the positions placing them, in id order """
  layouts: [DatasetPlaceLayout!]!
}

type DatasetPlaceLayout {
  layout: Layout!

  """ The datasets' recorded units placed in it """
  unitCount: Int!

  """
  The axis names a position in the layout has values on: its own, then those of the layouts above it, up to one
  the user can't read
  """
  axes: [String!]!
}

"""
A dataset. One the user cannot read, asked for by id, is a placeholder: its id, with no study or concept, and no records.
"""
type Dataset {
  id: ID!
  studyId: ID
  concept: OntologyNodeInterface

  """
  The dataset's records, in submission order. Without arguments, all of them.
  unitIds narrows them to the records of those units and of every unit below the readable ones (a unit graph or a plot
  selects what it contains; a hidden unit only its own records); start and end to records whose own period overlaps the window;
  offset and limit page through the result. With includeBelow false, unitIds narrows them to the records of exactly
  those units, e.g. the factor records of the units above some units.
  """
  records(unitIds: [ID!], start: DateTime, end: DateTime, offset: Int, limit: Int, includeBelow: Boolean): [Record]

  """ The number of records in the dataset, narrowed like records when the same arguments are given 
  """
  recordCount(unitIds: [ID!], start: DateTime, end: DateTime): Int!

  """
  The ids of the units the dataset has records for, in id order, narrowed like records when the same arguments
  are given: a client pages by unit with these, so that every record of a unit is in the same page
  """
  unitIds(unitIds: [ID!], start: DateTime, end: DateTime): [ID!]!

  """ What the records span, without reading them; null for a dataset the user cannot read 
  """
  dimensions: DatasetDimensions

  """ The Persons credited, with the roles they had """
  contributions: [Contribution]
  references: [ReferenceInterface]

  """
  The licence of the dataset's study. Unless licenceRequired is false, records and dimensions are refused
  (LICENCE_NOT_ACCEPTED) until the request carries an acceptance of its current text (licencesAccept), as are
  analyses of the dataset and downloads of the files its records cite (docs/licences.md §5)
  """
  licence: LegalReference

  """
  Whether the user must accept the licence to get the dataset's records: false without a licence, and for readers
  through a controlling team of the dataset or its study, who make their own agreements
  """
  licenceRequired: Boolean!
}

"""
A unit some datasets have records for, at it or below it: one node of the tree of units that matter to those
datasets, for narrowing their records to units
"""
type DatasetsUnit {
  unit: Unit!

  """ The number of units at or below this one that the datasets have records for, under the narrowing 
  """
  unitCount: Int!

  """ The number of those records """
  recordCount: Int!

  """ Whether a unit below this one has records: whether there is a level to open under it 
  """
  hasChildren: Boolean!
}

