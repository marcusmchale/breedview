#import "../references/referenceFragment.graphql"
#import "../ontology/entryFragment.graphql"
query programsStudy($studyId: ID!) {
  programsStudy(id: $studyId) {
    status
    result {
      id
      name
      fullname
      description
      practices
      start
      end
      design { ...OntologyEntryFields }
      groupings {
        id
        name
        scope
        extent
        type { ...OntologyEntryFields }
        dataset_scopes { datasetIds }
      }
      licence { id description text }
      references { ...ReferenceFields }
    }
    errors {
      message
    }
  }
}
