#import "../references/referenceFragment.graphql"
#import "../people/personFragment.graphql"
query programsTrial($trialId: ID, $studyId: ID) {
  programsTrial(id: $trialId, studyId: $studyId) {
    status
    result {
      id
      name
      fullname
      description
      start
      end
      contacts { ...PersonFields }
      references { ...ReferenceFields }
      studies { id name }
    }
    errors {
      message
    }
  }
}
