#import "../references/referenceFragment.graphql"
#import "../people/personFragment.graphql"
query programs {
  programs {
    status
    result {
      id
      name
      fullname
      description
      contacts { ...PersonFields }
      contributions { person { ...PersonFields } roles { id versionId view name } }
      references { ...ReferenceFields }
      trials { id, name }
    }
    errors {
      message
    }
  }
}
