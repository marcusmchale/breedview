query locationsMapStatus($code: String!) {
    locationsMapStatus(code: $code) {
        status
        result {
            code
            state
            size
            limit
            enabled
            error
            sections {
                name
                state
                size
                error
            }
            places {
                state
                enabled
                towns
                error
            }
        }
        errors {
            message
        }
    }
}
