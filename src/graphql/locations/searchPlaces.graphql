query locationsSearchPlaces($query: String!, $viewbox: [Float!], $bounded: Boolean, $country: String, $limit: Int) {
    locationsSearchPlaces(query: $query, viewbox: $viewbox, bounded: $bounded, country: $country, limit: $limit) {
        status
        result {
            name
            latitude
            longitude
            bounds
            description
            region
            country
            zoom
        }
        errors {
            message
        }
    }
}
