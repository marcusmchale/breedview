# The release of controlled entities and what the user may do with them, for badges and write access checks:
# the full controllers are slow to resolve
query controlsControllerRelease($entityLabel: ControlledModelLabel!, $entityIds: [ID!]!) {
  controlsControllers(entityLabel: $entityLabel, entityIds: $entityIds) {
    status
    result {
      release
      access
    }
    errors {
      message
    }
  }
}
