# The release of controlled entities, what the user may do with them, whether they are fixed (without controls, so
# no one changes them), and how to credit them, for badges and write access checks: the full controllers are slow to
# resolve
query controlsControllerRelease($entityLabel: ControlledModelLabel!, $entityIds: [ID!]!) {
  controlsControllers(entityLabel: $entityLabel, entityIds: $entityIds) {
    status
    result {
      release
      access
      fixed
      attributions
    }
    errors {
      message
    }
  }
}
