# The latest $lastWrites writes, or all of them when it is null
query controlsControllers($entityLabel: ControlledModelLabel!, $entityIds: [ID!]!, $lastWrites: Int = 20) {
  controlsControllers(entityLabel: $entityLabel, entityIds: $entityIds) {
    status
    result {
      controls { team { team { id name } standIn } release time }
      writes(last: $lastWrites) { user { id name } person { id view name institution restricted erased } time }
      writeCount
      teams { team { id name fullname } standIn }
      access
      release
      attributions
      created
      updated
    }
    errors {
      message
    }
  }
}
