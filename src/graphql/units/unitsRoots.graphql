#import "./unitFragment.graphql"
#import "./unitInheritedFragment.graphql"
query unitsRoots ($locationIds: [ID!]!, $below: Boolean) {
    unitsRoots (locationIds: $locationIds, below: $below) {
        status
        result {
            ...UnitFields
            ...UnitInheritedFields
        }
        errors {
            message
        }
    }
}