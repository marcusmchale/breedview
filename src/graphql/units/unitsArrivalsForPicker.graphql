# The arrivals at locations (with below, and at the locations under them) with their units by subject, as id and name,
# for selecting them in a picker
query unitsArrivalsForPicker ($locationIds: [ID!]!, $below: Boolean) {
    unitsArrivals (locationIds: $locationIds, below: $below) {
        status
        result {
            location { id name }
            start
            unitCount
            unitsBySubject {
                subject { id versionId view name }
                units { id name }
            }
        }
        errors { message }
    }
}
