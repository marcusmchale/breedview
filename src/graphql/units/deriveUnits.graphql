#import "./unitFragment.graphql"
# A unit derived from each of the units, by id or an arrival's, under parentIds or each a root at the position, with
# the germplasm given, else each source's copied unless copyGermplasm is false; the units created come back, in the order
# of the units they came from
mutation unitsDeriveUnits (
    $units: UnitsSelection!
    $parentIds: [ID!]
    $position: PositionInput
    $subjectId: ID
    $stage: DerivationStage
    $description: String
    $germplasmId: ID
    $copyGermplasm: Boolean
    $controlTeamId: ID!
    $release: ReadRelease
) {
    unitsDeriveUnits (
        units: $units
        parentIds: $parentIds
        position: $position
        subjectId: $subjectId
        stage: $stage
        description: $description
        germplasmId: $germplasmId
        copyGermplasm: $copyGermplasm
        controlTeamId: $controlTeamId
        release: $release
    ) {
        status
        result {
            ...UnitFields
            derivedFrom { unit { id name } stage description }
        }
        errors { message }
    }
}
