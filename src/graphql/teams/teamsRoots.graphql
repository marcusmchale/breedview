query teamsRoots {
    teamsRoots{
        status
        result {
            id
            name
            fullname
            children { id }
            affiliations {
                read { user { id name fullname } authorisation heritable heritableRequested }
                write { user { id name fullname } authorisation heritable heritableRequested }
                admin { user { id name fullname } authorisation heritable heritableRequested }
                curate { user { id name fullname } authorisation heritable heritableRequested }
            }
            inheritedAffiliations {
                read { user { id name fullname } authorisation heritable heritableRequested }
                write { user { id name fullname } authorisation heritable heritableRequested }
                admin { user { id name fullname } authorisation heritable heritableRequested }
                curate { user { id name fullname } authorisation heritable heritableRequested }
            }
            directAffiliations {
                read { user { id name fullname } authorisation heritable heritableRequested }
                write { user { id name fullname } authorisation heritable heritableRequested }
                admin { user { id name fullname } authorisation heritable heritableRequested }
                curate { user { id name fullname } authorisation heritable heritableRequested }
            }
        }
        errors {
            message
        }
    }
}