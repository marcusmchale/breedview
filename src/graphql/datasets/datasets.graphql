#import "./recordFragment.graphql"
#import "../people/personFragment.graphql"
query Datasets(
  $datasetIds: [ID!], $studyIds: [ID!], $conceptIds: [ID!],
  $unitIds: [ID!], $start: DateTime, $end: DateTime, $offset: Int, $limit: Int
) {
  datasets(ids: $datasetIds, studyIds: $studyIds, conceptIds: $conceptIds) {
    status
    result {
      id
      studyId
      concept {
        id versionId view
        name
        ... on Variable {
          scale {
            id versionId view
            name
            scaleType
            categories {
              id
              name
            }
          }
        }
        ... on Factor {
          scale {
            id versionId view
            name
            scaleType
            categories {
              id
              name
            }
          }
        }
      }
      # the records, narrowed to units (and everything below them) and a time window, and optionally paged
      records(unitIds: $unitIds, start: $start, end: $end, offset: $offset, limit: $limit) {
        ...RecordFields
      }
      contributors {
        ...PersonFields
      }
      references {
        id
      }
    }
    errors {
      name
      message
    }
  }
}
