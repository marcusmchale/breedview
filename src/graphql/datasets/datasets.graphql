#import "./recordFragment.graphql"
#import "../people/personFragment.graphql"
query Datasets(
  $datasetIds: [ID!], $studyIds: [ID!], $conceptIds: [ID!],
  $unitIds: [ID!], $start: DateTime, $end: DateTime, $offset: Int, $limit: Int, $includeBelow: Boolean
) {
  datasets(ids: $datasetIds, studyIds: $studyIds, conceptIds: $conceptIds) {
    status
    result {
      id
      studyId
      concept {
        id versionId view
        name
        phase
        ... on Variable {
          scale {
            id versionId view
            name
            scaleType
            categories {
              name
              description
            }
          }
        }
        ... on Factor {
          scale {
            id versionId view
            name
            scaleType
            categories {
              name
              description
            }
          }
        }
      }
      # the records, narrowed to units (and everything below them, unless includeBelow is false) and a time window,
      # and optionally paged
      records(unitIds: $unitIds, start: $start, end: $end, offset: $offset, limit: $limit, includeBelow: $includeBelow) {
        ...RecordFields
      }
      contributions {
        person { ...PersonFields }
        roles { id versionId view name phase }
      }
      references {
        id
      }
    }
    errors {
      name
      message
    }
  }
}
