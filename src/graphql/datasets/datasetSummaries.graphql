query DatasetsSummaries($studyId: ID!){
  datasetsSummaries(studyId: $studyId) {
    status
    result {
        id
        concept { id versionId view name phase }
        subjects { id versionId view name }
        locations { id name }
        unitRoots { id name }
        unit_count
        record_count
        start
        end
    }
    errors {
      name
      message
    }
  }
}