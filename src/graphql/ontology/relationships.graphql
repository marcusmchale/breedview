#import "./relationshipFragment.graphql"
query ontologyRelationships(
    $entryIds: [ID!]!
    $versionId: ID
    $view: OntologyView
) {
    ontologyRelationships(
        entryIds: $entryIds
        versionId: $versionId
        view: $view
    ){
        status
        result {
            ...OntologyRelationshipFields
        }
        errors {
            message
        }
    }
}