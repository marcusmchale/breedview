#import "./entryFragment.graphql"
query ontologyEntries(
    $entryIds: [ID!]
    $labels: [OntologyNodeLabel!]
    $versionId: ID
    $view: OntologyView
) {
    ontologyEntries(
        ids: $entryIds
        labels: $labels
        versionId: $versionId
        view: $view
    ){
        status
        result {
            ...OntologyEntryFields
        }
        errors {
            message
        }
    }
}