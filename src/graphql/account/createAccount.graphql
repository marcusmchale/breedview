mutation accountsCreateAccount(
    $name: String!,
    $fullname: String,
    $email: String!,
    $password: String!,
    $invitationToken: String,
    $acceptTeamIds: [ID!],
    $linkPerson: Boolean
) {
    accountsCreateAccount(
        name: $name,
        fullname: $fullname,
        email: $email,
        password: $password,
        invitationToken: $invitationToken,
        acceptTeamIds: $acceptTeamIds,
        linkPerson: $linkPerson
    ) {
        status
        errors {
            message
        }
    }
}
